<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#edf0f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f161d" media="(prefers-color-scheme: dark)">
<title>Factory</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232743e0'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<section id="login" class="login hidden">
  <h1>Factory</h1>
  <p>What's going out, where, and when.</p>
  <form id="login-form" class="stack">
    <label class="field"><span class="label">Password</span>
      <input type="password" id="password" autocomplete="current-password"></label>
    <button class="btn primary" type="submit" style="width:100%">Sign in</button>
    <p class="small" id="login-msg" role="alert" style="color:var(--hold)"></p>
  </form>
</section>

<div id="app" class="hidden">
  <header class="top">
    <select id="campaign" aria-label="Campaign"></select>
    <span class="grow"></span>
    <button class="cue" id="mode" type="button"><span class="dot"></span><span id="mode-label"></span></button>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</div>
<div id="overlay"></div>

<script src="/vendor/js-yaml.min.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
