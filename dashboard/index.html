<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>UGC Factory</title>
<style>
  :root {
    --bg: #0e0f11; --panel: #17191d; --line: #2a2d33; --text: #e9e7e2;
    --dim: #9a9890; --accent: #e5484d; --ok: #46a758; --warn: #f5a524;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, "Segoe UI", Inter, system-ui, sans-serif; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 13px; cursor: pointer; }
  button:hover { border-color: #4a4e57; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.danger { color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  select, input[type=password], input[type=text] { background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 10px; }
  textarea { width: 100%; min-height: 420px; background: #0b0c0e; border: 1px solid var(--line);
    border-radius: 10px; padding: 14px; font: 13px/1.55 var(--mono); resize: vertical; tab-size: 2; }
  header { display: flex; gap: 12px; align-items: center; padding: 14px 20px;
    border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; letter-spacing: .02em; }
  header .spacer { flex: 1; }
  nav { display: flex; gap: 4px; padding: 10px 20px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
  nav button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none;
    padding: 9px 12px; color: var(--dim); white-space: nowrap; }
  nav button.on { color: var(--text); border-bottom-color: var(--accent); }
  main { padding: 20px; max-width: 1100px; margin: 0 auto; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; font-size: 13px; color: var(--dim); }
  .chip.ok { color: var(--ok); border-color: #2c5a36; }
  .chip.warn { color: var(--warn); border-color: #6b4a12; }
  .chip.bad { color: var(--accent); border-color: #6e2528; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 4px; font-size: 15px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .dim { color: var(--dim); }
  .small { font-size: 13px; }
  .mono { font-family: var(--mono); font-size: 12.5px; }
  .caption { white-space: pre-wrap; border-left: 2px solid var(--line); padding-left: 10px; margin: 8px 0; }
  .versions { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; margin-top: 10px; }
  .version { border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font-size: 13px; }
  .msg { margin: 10px 0; padding: 9px 12px; border-radius: 8px; font-size: 14px; display: none; }
  .msg.show { display: block; }
  .msg.ok { background: #12301a; color: #8fdc9f; }
  .msg.bad { background: #3a1416; color: #ffa6a8; }
  a { color: #8ab4ff; }
  #login { max-width: 340px; margin: 18vh auto; text-align: center; }
  #login input { width: 100%; margin: 14px 0; padding: 11px; text-align: center; }
  #login button { width: 100%; padding: 11px; }
  .hidden { display: none !important; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 500; }
</style>
</head>
<body>

<section id="login" class="hidden">
  <h1>UGC Factory</h1>
  <form id="login-form">
    <input type="password" id="password" placeholder="Password" autocomplete="current-password" autofocus>
    <button class="primary" type="submit">Sign in</button>
  </form>
  <div class="msg bad" id="login-msg"></div>
</section>

<div id="app" class="hidden">
  <header>
    <h1>UGC Factory</h1>
    <select id="campaign" aria-label="Campaign"></select>
    <span class="spacer"></span>
    <button id="reload">Reload</button>
    <button id="logout">Sign out</button>
  </header>
  <nav id="tabs"></nav>
  <main>
    <div class="msg" id="msg"></div>
    <div id="view"></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js" defer></script>
<script>
"use strict";
const $ = (sel) => document.querySelector(sel);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const TABS = ["Queue", "Lineup", "Captions", "Settings", "Accounts", "Activity"];
let STATE = null;
let TAB = "Queue";

async function api(path, { method = "GET", body } = {}) {
  const init = { method, credentials: "same-origin", headers: {} };
  if (method !== "GET") {
    init.headers["content-type"] = "application/json";
    init.headers["x-ugc"] = "1";
    init.body = JSON.stringify(body || {});
  }
  const res = await fetch(`/api/${path}`, init);
  let data = {};
  try { data = await res.json(); } catch { /* an empty body is fine */ }
  if (res.status === 401 && path !== "login") { showLogin(); throw new Error("sign in"); }
  if (!res.ok) throw new Error(data.error || `request failed (${res.status})`);
  return data;
}

function say(text, kind = "ok") {
  const el = $("#msg");
  el.textContent = text;
  el.className = `msg show ${kind}`;
  if (kind === "ok") setTimeout(() => { el.className = "msg"; }, 6000);
}

function showLogin() { $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); }

$("#login-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const out = $("#login-msg");
  out.className = "msg";
  try {
    await api("login", { method: "POST", body: { password: $("#password").value } });
    $("#password").value = "";
    $("#login").classList.add("hidden");
    await load();
  } catch (err) {
    out.textContent = err.message;
    out.className = "msg show bad";
  }
});

$("#logout").addEventListener("click", async () => { await api("logout", { method: "POST" }); showLogin(); });
$("#reload").addEventListener("click", () => load());
$("#campaign").addEventListener("change", () => render());

// ------------------------------------------------------------------- state

const slug = () => $("#campaign").value;
const file = (path) => STATE.files.find((f) => f.path === path);
const campaignFile = (name) => file(`campaigns/${slug()}/${name}`);

function setting(text, key) {
  const m = new RegExp(`^\\s*${key}:\\s*([^#\\n]+)`, "m").exec(text || "");
  return m ? m[1].trim() : null;
}

async function load() {
  try {
    STATE = await api("state");
  } catch (err) {
    if (err.message !== "sign in") say(err.message, "bad");
    return;
  }
  $("#app").classList.remove("hidden");
  const picked = slug();
  $("#campaign").innerHTML = STATE.campaigns.map((c) => `<option>${esc(c)}</option>`).join("");
  if (STATE.campaigns.includes(picked)) $("#campaign").value = picked;
  $("#tabs").innerHTML = TABS.map((t) => `<button data-tab="${t}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach((b) =>
    b.addEventListener("click", () => { TAB = b.dataset.tab; render(); }));
  render();
}

function render() {
  $("#tabs").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.tab === TAB));
  ({ Queue: viewQueue, Lineup: viewLineup, Captions: viewCaptions,
     Settings: viewSettings, Accounts: viewAccounts, Activity: viewActivity })[TAB]();
}

function statusChips() {
  const config = (campaignFile("config.yaml") || {}).text || "";
  const paused = setting(config, "paused") === "true";
  const dry = setting(config, "dry_run") === "true";
  const live = !paused && !dry;
  return `<div class="chips">
    <span class="chip ${live ? "ok" : "warn"}">${live ? "LIVE — posting for real" : paused ? "paused" : "dry run — nothing posts"}</span>
    <span class="chip">${esc(setting(config, "posts_per_day") || "?")} posts/day</span>
    <span class="chip">${esc(setting(config, "timezone") || "")}</span>
  </div>`;
}

// ------------------------------------------------------------------- queue

function viewQueue() {
  const raw = campaignFile("queue.json");
  let items = [];
  try { items = raw ? JSON.parse(raw.text).items || [] : []; } catch { /* shown as empty */ }
  items.sort((a, b) => String(a.scheduled_for).localeCompare(String(b.scheduled_for)));
  const tz = setting((campaignFile("config.yaml") || {}).text, "timezone") || undefined;
  const when = (iso) => {
    try { return new Date(iso).toLocaleString("en-US", { timeZone: tz, weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); }
    catch { return iso; }
  };
  const cards = items.map((i) => {
    const parts = i.parts || {};
    const clips = [parts.hook, ...(parts.bodies || "").split(",")].filter(Boolean).join(" + ");
    const music = parts.music ? `${parts.music} @ ${parts.music_offset_sec || 0}s` : "no music";
    const posts = (i.posts || []).map((p) =>
      `<span class="chip ${p.status === "pushed" ? "ok" : p.status === "failed" ? "bad" : p.status === "cancelled" ? "" : "warn"}">${esc(p.account)} · ${esc(p.status)}</span>`).join(" ");
    const versions = Object.entries(i.variants || {}).map(([name, v]) => `
      <div class="version">
        <strong>${esc(name)}</strong><br>
        <span class="mono">${esc((v.parts || {}).hook || "")}${(v.parts || {}).music ? ` @ ${esc(v.parts.music_offset_sec)}s` : ""}</span><br>
        ${v.overlay ? `<span class="dim">on screen:</span> ${esc(v.overlay)}<br>` : ""}
        ${v.video_url ? `<a href="${esc(v.video_url)}" target="_blank" rel="noopener">watch</a>` : ""}
        <button class="danger small" data-pull="${esc(i.id)}" data-account="${esc(name)}">pull from ${esc(name)}</button>
      </div>`).join("");
    return `<div class="card">
      <div class="row">
        <h3>${esc(when(i.scheduled_for))}</h3>
        <span class="chip">${esc(i.status)}</span>
        <span class="dim small">${esc(i.creative)}${i.lineup_id ? ` · lineup: ${esc(i.lineup_id)}` : ""}</span>
        <span class="spacer" style="flex:1"></span>
        ${i.video_url ? `<a href="${esc(i.video_url)}" target="_blank" rel="noopener">watch</a>` : ""}
        <button class="danger" data-pull="${esc(i.id)}">Pull everywhere</button>
      </div>
      <div class="mono dim">${esc(clips)} · ${esc(music)} · ${esc(String(i.id).slice(0, 8))}</div>
      ${i.overlay ? `<div class="small"><span class="dim">on screen:</span> ${esc(i.overlay)}</div>` : ""}
      <div class="caption small">${esc(i.caption)}</div>
      ${i.first_comment ? `<div class="small dim">first comment: ${esc(i.first_comment)}</div>` : ""}
      <div class="chips" style="margin:8px 0 0">${posts}</div>
      ${versions ? `<div class="versions">${versions}</div>` : ""}
    </div>`;
  }).join("");
  $("#view").innerHTML = statusChips() + (cards || `<p class="dim">Nothing queued. The next render fills this.</p>`)
    + `<p class="dim small">"Pull" removes a video from the queue and from Buffer. It runs as a job (about a minute); reload to see the result. Once a network has published a post, only the network can take it down.</p>`;
  $("#view").querySelectorAll("[data-pull]").forEach((b) => b.addEventListener("click", async () => {
    const account = b.dataset.account || "";
    if (!confirm(`Pull this video${account ? ` from ${account}` : " from every account"}?`)) return;
    b.disabled = true;
    try {
      await api("run", { method: "POST", body: { workflow: "queue", inputs: {
        campaign: slug(), discard: "all", video_id: b.dataset.pull, account } } });
      say("Pull started. Reload in a minute to confirm it went.");
    } catch (err) { say(err.message, "bad"); b.disabled = false; }
  }));
}

// ----------------------------------------------------------------- editors

function editor(path, { yaml = false, hint = "" } = {}) {
  const f = file(path);
  $("#view").innerHTML = `${statusChips()}
    <div class="row" style="margin-bottom:10px">
      <span class="mono dim">${esc(path)}</span><span style="flex:1"></span>
      <button class="primary" id="save">Save</button>
    </div>
    ${hint ? `<p class="dim small">${hint}</p>` : ""}
    <textarea id="text" spellcheck="false"></textarea>
    <p class="dim small">Saving commits to the repository and the next render picks it up. A mistake in the file fails the check on GitHub and the next render, with a Discord alert; videos already queued are not affected.</p>`;
  $("#text").value = f ? f.text : "";
  $("#save").addEventListener("click", async () => {
    const text = $("#text").value;
    if (yaml && window.jsyaml) {
      try { window.jsyaml.load(text); }
      catch (err) { say(`Not saved — this is not valid YAML: ${err.reason || err.message} (line ${(err.mark || {}).line + 1 || "?"})`, "bad"); return; }
    }
    $("#save").disabled = true;
    try {
      const res = await api("file", { method: "PUT", body: { path, text, sha: f ? f.sha : "" } });
      if (f) { f.text = text; f.sha = res.sha; } else STATE.files.push({ path, text, sha: res.sha });
      say("Saved.");
    } catch (err) { say(err.message, "bad"); }
    $("#save").disabled = false;
  });
}

function viewLineup() {
  editor(`campaigns/${slug()}/lineup.yaml`, { yaml: true,
    hint: "Posts spelled out by hand: which clip, which second of the song, which line on screen, which caption, which accounts, when. Each <code>id</code> posts once." });
}

function viewSettings() {
  const path = `campaigns/${slug()}/config.yaml`;
  editor(path, { yaml: true });
  const f = file(path);
  if (!f) return;
  const flip = (key) => {
    const now = setting(f.text, key);
    if (now === null) return "";
    const label = key === "paused"
      ? (now === "true" ? "Resume campaign" : "Pause campaign")
      : (now === "true" ? "Turn dry run OFF (post for real)" : "Turn dry run on");
    return `<button data-flip="${key}">${label}</button>`;
  };
  const bar = document.createElement("div");
  bar.className = "row";
  bar.style.marginBottom = "14px";
  bar.innerHTML = flip("paused") + flip("dry_run");
  $("#view").insertBefore(bar, $("#view").children[1]);
  bar.querySelectorAll("[data-flip]").forEach((b) => b.addEventListener("click", () => {
    const key = b.dataset.flip;
    const now = setting($("#text").value, key);
    const next = now === "true" ? "false" : "true";
    if (key === "dry_run" && next === "false" && !confirm("This makes the campaign post for real. Continue?")) return;
    $("#text").value = $("#text").value.replace(
      new RegExp(`^(\\s*${key}:\\s*)(true|false)`, "m"), `$1${next}`);
    $("#save").click();
    setTimeout(render, 1500);
  }));
}

function viewCaptions() {
  const prefix = `campaigns/${slug()}/`;
  const banks = STATE.files.map((f) => f.path)
    .filter((p) => p.startsWith(prefix) && p.endsWith(".txt"));
  if (!banks.length) { $("#view").innerHTML = `<p class="dim">No caption files yet.</p>`; return; }
  const current = window.__bank && banks.includes(window.__bank) ? window.__bank : banks[0];
  editor(current, { hint: "Records are separated by a line of <code>---</code>. Optional first lines: <code>overlay:</code> (drawn on the video, <code>|</code> breaks the line) and <code>title:</code> (YouTube). The rest is the caption." });
  const pick = document.createElement("select");
  pick.innerHTML = banks.map((p) => `<option value="${esc(p)}" ${p === current ? "selected" : ""}>${esc(p.slice(prefix.length))}</option>`).join("");
  pick.addEventListener("change", () => { window.__bank = pick.value; viewCaptions(); });
  $("#view").querySelector(".row").prepend(pick);
}

function viewAccounts() {
  const f = file("accounts.yaml");
  $("#view").innerHTML = `<p class="dim small">Every Buffer channel the engine can post to. Add a login from your computer with <code>./ugc connect --slot N --name login_name</code> — it needs the Buffer key, which never comes near this page.</p>
    <textarea readonly spellcheck="false"></textarea>`;
  $("#view").querySelector("textarea").value = f ? f.text : "accounts.yaml not found";
}

// ---------------------------------------------------------------- activity

async function viewActivity() {
  const jobs = [
    ["render", "Render now", "Makes the next batch of videos"],
    ["topup", "Push to Buffer now", "Sends queued videos to Buffer"],
    ["preflight", "Check everything", "Validates config, captions and library"],
    ["metrics", "Refresh numbers", "Pulls the latest views per post"],
    ["diagnose", "Why didn't it post?", "Asks Buffer what happened on each account"],
  ];
  $("#view").innerHTML = statusChips() + `<div class="card">
      <label class="row small"><input type="checkbox" id="dry" checked> Test run (render and push without posting) — untick to do it for real</label>
      <div class="row" style="margin-top:12px">${jobs.map(([w, label, title]) =>
        `<button data-run="${w}" title="${esc(title)}">${label}</button>`).join("")}</div>
    </div>
    <div class="card"><h3>Recent jobs</h3><div id="runs" class="dim">Loading…</div></div>`;
  $("#view").querySelectorAll("[data-run]").forEach((b) => b.addEventListener("click", async () => {
    const workflow = b.dataset.run;
    const inputs = { campaign: slug() };
    if (workflow === "render" || workflow === "topup") {
      inputs.dry_run = String($("#dry").checked);
      if (!$("#dry").checked && !confirm(`Run ${workflow} for real on ${slug()}?`)) return;
    }
    try { await api("run", { method: "POST", body: { workflow, inputs } }); say(`${b.textContent} started.`); setTimeout(runs, 4000); }
    catch (err) { say(err.message, "bad"); }
  }));
  runs();
}

async function runs() {
  const el = $("#runs");
  if (!el) return;
  try {
    const { runs: list } = await api("runs");
    el.innerHTML = `<table><tr><th>Job</th><th>Result</th><th>Started</th><th></th></tr>${list.map((r) => `
      <tr><td>${esc(r.name)}</td>
      <td><span class="chip ${r.conclusion === "success" ? "ok" : r.conclusion === "failure" ? "bad" : "warn"}">${esc(r.conclusion || r.status)}</span></td>
      <td class="dim">${esc(new Date(r.started).toLocaleString())}</td>
      <td><a href="${esc(r.url)}" target="_blank" rel="noopener">details</a></td></tr>`).join("")}</table>`;
  } catch (err) { el.textContent = err.message; }
}

load();
</script>
</body>
</html>
