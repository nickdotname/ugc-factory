[mypy]
python_version = 3.11
strict = True
warn_unreachable = True
disallow_any_generics = True
namespace_packages = True
explicit_package_bases = True
mypy_path = .

[mypy-tests.*]
# Tests may use untyped fixtures freely; the production contract is what
# `strict` is protecting.
disallow_untyped_defs = False
