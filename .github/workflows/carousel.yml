name: carousel

# Posts one information carousel: draws the slides from a spec in
# studio/carousels/, uploads them where Instagram can fetch them, and sends the
# post. By hand only since 2026-11-26 (the publish job no longer starts it):
# 33 carousels reached 3-18 people each (docs/brain/reviews/2026-11-26). Without
# a spec it takes the next one waiting for nostalgia; psychedelic.station's cap
# is 0 (studio/post_carousel.py DAILY_CAP), the band's own page too.
on:
  workflow_dispatch:
    inputs:
      spec:
        description: which carousel (file name without .json; blank = next one waiting)
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: publish             # shares the publisher's lock: one sender at a time
  cancel-in-progress: false

jobs:
  carousel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      SPEC: ${{ inputs.spec }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -q -r requirements.txt numpy opencv-python-headless Pillow
      - name: Draw the slides and hold the post
        id: make
        run: python studio/post_carousel.py ${SPEC:+--spec "$SPEC"}
      - name: Record it
        run: |
          git config user.name  "ugc-factory"
          git config user.email "ugc-factory@users.noreply.github.com"
          git add outbox studio/carousels/posted.json
          git diff --cached --quiet && exit 0
          git commit -q -m "carousel held [skip ci]"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
      - name: Send it
        if: steps.make.outputs.accounts != ''
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_PAGE_TOKENS: ${{ secrets.IG_PAGE_TOKENS }}
          IG_TOKEN_2: ${{ secrets.IG_TOKEN_2 }}
          IG_TOKEN_3: ${{ secrets.IG_TOKEN_3 }}
          IG_TOKEN_4: ${{ secrets.IG_TOKEN_4 }}
          IG_TOKEN_5: ${{ secrets.IG_TOKEN_5 }}
          IG_TOKEN_6: ${{ secrets.IG_TOKEN_6 }}
        run: |
          for a in ${{ steps.make.outputs.accounts }}; do python -m src.cli publish-due --account "$a" || echo "::warning::$a did not publish"; done
