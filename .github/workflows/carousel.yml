name: carousel

# Posts one information carousel: draws the slides from a spec in
# studio/carousels/, uploads them where Instagram can fetch them, and sends the
# post. Three times a day it takes the next spec that has not been posted yet;
# when none is waiting it does nothing.
on:
  workflow_dispatch:
    inputs:
      spec:
        description: which carousel (file name without .json; blank = next one waiting)
        required: false
        default: ""
  schedule:
    - cron: "12 16,20 * * *"  # 11:12am and 3:12pm New York
    - cron: "12 0 * * *"      # 7:12pm New York

permissions:
  contents: write

concurrency:
  group: publish             # shares the publisher's lock: one sender at a time
  cancel-in-progress: false

jobs:
  carousel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      SPEC: ${{ inputs.spec }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -q -r requirements.txt numpy opencv-python-headless Pillow
      - name: Draw the slides and hold the post
        id: make
        run: python studio/post_carousel.py ${SPEC:+--spec "$SPEC"}
      - name: Record it
        run: |
          git config user.name  "ugc-factory"
          git config user.email "ugc-factory@users.noreply.github.com"
          git add outbox studio/carousels/posted.json
          git diff --cached --quiet && exit 0
          git commit -q -m "carousel held [skip ci]"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
      - name: Send it
        if: steps.make.outputs.account != ''
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_TOKEN_2: ${{ secrets.IG_TOKEN_2 }}
          IG_TOKEN_3: ${{ secrets.IG_TOKEN_3 }}
          IG_TOKEN_4: ${{ secrets.IG_TOKEN_4 }}
        run: python -m src.cli publish-due --account "${{ steps.make.outputs.account }}"
