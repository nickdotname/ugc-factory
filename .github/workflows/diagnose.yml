name: diagnose

# Manual only. Prints what Buffer actually did with recent posts, including the
# error the network returned — the field that explains a queue which did not
# drain. Read-only: it publishes nothing and changes nothing.
on:
  workflow_dispatch:
    inputs:
      campaign:
        description: campaign slug (blank = all)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # Campaigns are discovered from the repo rather than listed here, so adding
  # one is a matter of creating campaigns/<slug>/ — no workflow edit, which is
  # what lets the dashboard create campaigns that actually run (SPEC §15).
  discover:
    runs-on: ubuntu-latest
    outputs:
      campaigns: ${{ steps.list.outputs.campaigns }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          slugs=$(find campaigns -mindepth 1 -maxdepth 1 -type d \
                    -not -name '_*' -exec basename {} \; | sort)
          echo "found: $slugs"
          echo "campaigns=$(printf '%s\n' $slugs | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  diagnose:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        campaign: ${{ fromJson(needs.discover.outputs.campaigns) }}
      max-parallel: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt

      - name: Diagnose
        if: ${{ inputs.campaign == '' || inputs.campaign == matrix.campaign }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python -m src.cli diagnose --campaign "${{ matrix.campaign }}"
