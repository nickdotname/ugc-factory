name: diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      campaigns: ${{ steps.list.outputs.campaigns }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          slugs=$(find campaigns -mindepth 1 -maxdepth 1 -type d -not -name '_*' -exec basename {} \; | sort)
          echo "found: $slugs"
          echo "campaigns=$(printf '%s\n' $slugs | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  show:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      matrix:
        campaign: ${{ fromJson(needs.discover.outputs.campaigns) }}
    steps:
      - run: echo "campaign is ${{ matrix.campaign }}"
