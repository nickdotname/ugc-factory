name: queue

# Manual only. Shows a campaign's queue, and withdraws items that a config
# change has stranded — everything already rendered carries the settings it
# was built with, so muting music or rewriting captions does nothing about a
# queue that is already deep.
#
# Lives here rather than being run locally because withdrawing a *pushed*
# item means deleting it from Buffer, and the API key is a repo secret. The
# `pending` half needs no key and can be done from a laptop.
#
# Default `discard` is blank, which only reports. Withdrawing is deliberate.
on:
  workflow_dispatch:
    inputs:
      campaign:
        description: campaign slug (blank = all)
        required: false
        default: ""
      discard:
        description: what to withdraw (blank = report only)
        required: false
        default: ""
        type: choice
        options: ["", "pending", "pushed", "all"]
      video_id:
        description: only this video (a prefix of its id); blank = all
        required: false
        default: ""
      account:
        description: only this account's copy; blank = every account
        required: false
        default: ""

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      campaigns: ${{ steps.list.outputs.campaigns }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          slugs=$(find campaigns -mindepth 1 -maxdepth 1 -type d \
                    -not -name '_*' -exec basename {} \; | sort)
          echo "found: $slugs"
          echo "campaigns=$(printf '%s\n' $slugs | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  queue:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        campaign: ${{ fromJson(needs.discover.outputs.campaigns) }}
      # Serialised: each run commits campaigns/, and parallel jobs would race
      # the push the same way topup does.
      max-parallel: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt

      - name: Queue
        if: ${{ inputs.campaign == '' || inputs.campaign == matrix.campaign }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_API_KEY_2: ${{ secrets.BUFFER_API_KEY_2 }}
          BUFFER_API_KEY_3: ${{ secrets.BUFFER_API_KEY_3 }}
          BUFFER_API_KEY_4: ${{ secrets.BUFFER_API_KEY_4 }}
          BUFFER_API_KEY_5: ${{ secrets.BUFFER_API_KEY_5 }}
          BUFFER_API_KEY_6: ${{ secrets.BUFFER_API_KEY_6 }}
          BUFFER_API_KEY_7: ${{ secrets.BUFFER_API_KEY_7 }}
          BUFFER_API_KEY_8: ${{ secrets.BUFFER_API_KEY_8 }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_PAGE_TOKENS: ${{ secrets.IG_PAGE_TOKENS }}
          IG_TOKEN_2: ${{ secrets.IG_TOKEN_2 }}
          IG_TOKEN_3: ${{ secrets.IG_TOKEN_3 }}
          IG_TOKEN_4: ${{ secrets.IG_TOKEN_4 }}
          IG_TOKEN_5: ${{ secrets.IG_TOKEN_5 }}
          IG_TOKEN_6: ${{ secrets.IG_TOKEN_6 }}
          IG_TOKEN_7: ${{ secrets.IG_TOKEN_7 }}
          IG_TOKEN_8: ${{ secrets.IG_TOKEN_8 }}
          IG_TOKEN_9: ${{ secrets.IG_TOKEN_9 }}
          IG_TOKEN_10: ${{ secrets.IG_TOKEN_10 }}
          IG_TOKEN_11: ${{ secrets.IG_TOKEN_11 }}
          IG_TOKEN_12: ${{ secrets.IG_TOKEN_12 }}
          IG_TOKEN_13: ${{ secrets.IG_TOKEN_13 }}
          IG_TOKEN_14: ${{ secrets.IG_TOKEN_14 }}
          IG_TOKEN_15: ${{ secrets.IG_TOKEN_15 }}
          IG_TOKEN_16: ${{ secrets.IG_TOKEN_16 }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          # Free text goes through the environment, never into the script
          # itself: interpolated straight into `run:` it would be shell.
          QUEUE_ID: ${{ inputs.video_id }}
          QUEUE_ACCOUNT: ${{ inputs.account }}
        run: |
          python -m src.cli queue --campaign "${{ matrix.campaign }}" \
            ${{ inputs.discard && format('--discard {0}', inputs.discard) || '' }} \
            ${QUEUE_ID:+--id "$QUEUE_ID"} \
            ${QUEUE_ACCOUNT:+--account "$QUEUE_ACCOUNT"}

      - name: Commit any withdrawal
        if: ${{ inputs.discard != '' && (inputs.campaign == '' || inputs.campaign == matrix.campaign) }}
        run: |
          git config user.name  "ugc-factory"
          git config user.email "ugc-factory@users.noreply.github.com"
          git add campaigns/
          if git diff --cached --quiet; then
            echo "nothing withdrawn"
          else
            git commit -m "withdraw ${{ inputs.discard }} for ${{ matrix.campaign }} [skip ci]"
            # Same retry as every other committing workflow: pull-then-push
            # loses any race that opens between the two.
            bash scripts/push_retry.sh
          fi
