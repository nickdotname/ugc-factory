name: studio

# Makes new videos every night so the clip libraries keep growing on their own.
# studio/nightly.py renders them from the songs in studio/songs (stems, lyrics,
# timings) and adds them to each song's library, where the daily render picks
# from. What it makes, and how many, is in studio/nightly.yaml.
on:
  workflow_dispatch:
    inputs:
      campaign:
        description: only this campaign (blank = every target)
        required: false
        default: ""
      count:
        description: videos per target this run (blank = per_night)
        required: false
        default: ""
      set:
        description: 'knobs every video must use, e.g. scene=bridge or topic=zeta (blank = the learner picks)'
        required: false
        default: ""

permissions:
  contents: write   # uploads to the clip libraries and records what was made

concurrency:
  group: studio
  cancel-in-progress: false

jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      CAMPAIGN: ${{ inputs.campaign }}
      COUNT: ${{ inputs.count }}
      SET: ${{ inputs.set }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            studio/requirements.txt

      - name: Install ffmpeg and fonts
        run: |
          bash scripts/apt_install.sh ffmpeg fonts-liberation fonts-dejavu-core fonts-inter libsndfile1

      - name: Install dependencies
        run: |
          # EGL + Mesa: studio/gl.py draws real shaders off-screen (llvmpipe, no GPU) and bpy's Workbench needs them too.
          sudo apt-get install -y -qq libegl1 libgl1 libgl1-mesa-dri >/dev/null
          pip install -q -r requirements.txt -r studio/requirements.txt

      # Blender as a Python module, only on nights that render the low-poly story page (it is a large download).
      - name: Install Blender (bpy)
        run: |
          if grep -q "style: lowpoly" studio/nightly.yaml; then
            pip install -q "bpy>=4.2,<5"
          else echo "no low-poly page tonight"; fi

      # Never allowed to stop the videos being made: it reports what it could not read and carries on.
      - name: Read the numbers
        run: python studio/learn.py || echo "::warning::the learning step failed and was skipped"

      - name: Render and add to the libraries
        run: |
          python studio/nightly.py ${CAMPAIGN:+--only "$CAMPAIGN"} ${COUNT:+--count "$COUNT"} ${SET:+--set "$SET"}

      - name: Record what was made
        if: always()
        run: |
          git config user.name  "ugc-factory"
          git config user.email "ugc-factory@users.noreply.github.com"
          git add campaigns/*/recipes.json studio/weights.json studio/LEARNED.md studio/clicks.json 2>/dev/null || git add campaigns/*/recipes.json studio/weights.json studio/LEARNED.md
          git diff --cached --quiet && exit 0
          git commit -q -m "studio: new videos [skip ci]"
          # The stats files are rewritten whole each run, so on a clash this run's copy wins
          # (-X theirs, in a rebase, is the commit being replayed: ours).
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && break; git rebase --abort 2>/dev/null; sleep 5; done

      # A token lasts about 60 days and nothing else warns before posting stops.
      - name: Warn before an Instagram token runs out
        if: always()
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_PAGE_TOKENS: ${{ secrets.IG_PAGE_TOKENS }}
          IG_TOKEN_2: ${{ secrets.IG_TOKEN_2 }}
          IG_TOKEN_3: ${{ secrets.IG_TOKEN_3 }}
          IG_TOKEN_4: ${{ secrets.IG_TOKEN_4 }}
          IG_TOKEN_5: ${{ secrets.IG_TOKEN_5 }}
          IG_TOKEN_6: ${{ secrets.IG_TOKEN_6 }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python scripts/ig_token_check.py --warn-days 7
