name: publish

# Accounts that post to Instagram directly have their posts held in outbox/
# until their slot (src/publishers/instagram.py). This sends whatever is due.
# Accounts that post through Buffer are not touched: Buffer publishes those.
#
# Every 5 minutes, started by an outside timer (the Cloudflare worker
# ugc-publish-timer), so a post goes out within about 5 minutes of its slot.
# GitHub's own schedule below is only a backup: it starts runs late under load.
on:
  workflow_dispatch:
    inputs:
      account:
        description: only this account (blank = all)
        required: false
        default: ""
      dry_run:
        description: show what is held and send nothing
        type: boolean
        default: true
      now:
        description: send the next held post right now, whatever its slot (give an account)
        type: boolean
        default: false
  schedule:
    - cron: "8,23,38,53 * * * *"

permissions:
  contents: write   # the outbox records what was sent, so nothing is sent twice
  actions: write    # starts the daily studio and carousel jobs at their times (see the last step)

# One at a time. Two runs reading the same outbox would both see the same post
# as due, and a Reel that reaches Instagram twice cannot be recalled.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Publish what is due
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_PAGE_TOKENS: ${{ secrets.IG_PAGE_TOKENS }}
          IG_TOKEN_2: ${{ secrets.IG_TOKEN_2 }}
          IG_TOKEN_3: ${{ secrets.IG_TOKEN_3 }}
          IG_TOKEN_4: ${{ secrets.IG_TOKEN_4 }}
          IG_TOKEN_5: ${{ secrets.IG_TOKEN_5 }}
          IG_TOKEN_6: ${{ secrets.IG_TOKEN_6 }}
          IG_TOKEN_7: ${{ secrets.IG_TOKEN_7 }}
          IG_TOKEN_8: ${{ secrets.IG_TOKEN_8 }}
          IG_TOKEN_9: ${{ secrets.IG_TOKEN_9 }}
          IG_TOKEN_10: ${{ secrets.IG_TOKEN_10 }}
          IG_TOKEN_11: ${{ secrets.IG_TOKEN_11 }}
          IG_TOKEN_12: ${{ secrets.IG_TOKEN_12 }}
          IG_TOKEN_13: ${{ secrets.IG_TOKEN_13 }}
          IG_TOKEN_14: ${{ secrets.IG_TOKEN_14 }}
          IG_TOKEN_15: ${{ secrets.IG_TOKEN_15 }}
          IG_TOKEN_16: ${{ secrets.IG_TOKEN_16 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name  "ugc-factory"
          git config user.email "ugc-factory@users.noreply.github.com"
          python -m src.cli publish-due \
            ${{ inputs.account != '' && format('--account "{0}"', inputs.account) || '' }} \
            ${{ inputs.dry_run == true && '--dry-run' || '' }} \
            ${{ inputs.now == true && '--now' || '' }}

      # A collab post invites another of our accounts; the same login manages it,
      # so the invite is accepted here, a run or two after the post goes out.
      - name: Accept collab invites between our own accounts
        if: ${{ inputs.dry_run != true }}
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_PAGE_TOKENS: ${{ secrets.IG_PAGE_TOKENS }}
          IG_TOKEN_2: ${{ secrets.IG_TOKEN_2 }}
          IG_TOKEN_3: ${{ secrets.IG_TOKEN_3 }}
          IG_TOKEN_4: ${{ secrets.IG_TOKEN_4 }}
          IG_TOKEN_5: ${{ secrets.IG_TOKEN_5 }}
          IG_TOKEN_6: ${{ secrets.IG_TOKEN_6 }}
        run: |
          python studio/collabs.py accept
          git add outbox
          git diff --cached --quiet && exit 0
          git commit -q -m "collab invites accepted [skip ci]"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done

      # "what song is this?" under our posts gets the song and @close__quarters as a reply
      # (studio/replies.py). Once a quarter hour, capped per account; nothing else is answered.
      - name: Answer song questions in the comments
        if: ${{ inputs.dry_run != true }}
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_PAGE_TOKENS: ${{ secrets.IG_PAGE_TOKENS }}
        run: |
          m=$(( 10#$(date -u +%M) )); [ $(( m % 15 )) -lt 5 ] || exit 0
          python studio/replies.py
          [ -d replies ] || exit 0
          git add replies
          git diff --cached --quiet && exit 0
          git commit -q -m "comment replies [skip ci]"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done

      # The numbers on dashboard.closequarters.vip (cqdash/): rewritten when anything changed.
      - name: Refresh the dashboard
        if: ${{ inputs.dry_run != true }}
        continue-on-error: true
        env:                       # only to fetch each account's profile picture once a day
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_PAGE_TOKENS: ${{ secrets.IG_PAGE_TOKENS }}
          IG_TOKEN_2: ${{ secrets.IG_TOKEN_2 }}
          IG_TOKEN_3: ${{ secrets.IG_TOKEN_3 }}
          IG_TOKEN_4: ${{ secrets.IG_TOKEN_4 }}
          IG_TOKEN_5: ${{ secrets.IG_TOKEN_5 }}
          IG_TOKEN_6: ${{ secrets.IG_TOKEN_6 }}
          IG_TOKEN_7: ${{ secrets.IG_TOKEN_7 }}
          IG_TOKEN_8: ${{ secrets.IG_TOKEN_8 }}
          IG_TOKEN_9: ${{ secrets.IG_TOKEN_9 }}
          IG_TOKEN_10: ${{ secrets.IG_TOKEN_10 }}
          IG_TOKEN_11: ${{ secrets.IG_TOKEN_11 }}
          IG_TOKEN_12: ${{ secrets.IG_TOKEN_12 }}
          IG_TOKEN_13: ${{ secrets.IG_TOKEN_13 }}
          IG_TOKEN_14: ${{ secrets.IG_TOKEN_14 }}
          IG_TOKEN_15: ${{ secrets.IG_TOKEN_15 }}
          IG_TOKEN_16: ${{ secrets.IG_TOKEN_16 }}
        run: |
          pip install -q Pillow || true
          python scripts/dash_data.py
          git add cqdash/data.json
          git add cqdash/followers.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "dashboard numbers [skip ci]"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done

      # GitHub's own schedules skip runs, and this job is started every 5 minutes
      # by an outside timer that does not. So it is the clock for the daily jobs
      # too: only the run in the first 5 minutes of a job's quarter-hour starts it.
      # The timer's other runs (:05, :10), GitHub's backup runs (:08, :23, :38, :53)
      # and runs started by hand later in the quarter-hour start nothing, so a job
      # is not started twice.
      - name: Start the daily jobs when their time comes
        if: inputs.dry_run != true && inputs.now != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          m=$(( 10#$(date -u +%M) ))
          [ $(( m % 15 )) -lt 5 ] || exit 0
          slot=$(date -u +%H:)$(printf '%02d' $(( m / 15 * 15 )))
          # GitHub's dispatch API sometimes answers 500 (2026-11-25 06:45: the night's studio never ran). Retry it.
          gh() { if [ "$1 $2" = "workflow run" ]; then for i in 1 2 3 4 5; do command gh "$@" && return 0; sleep $(( i * 15 )); done; return 1; else command gh "$@"; fi; }
          case "$slot" in
            06:45) gh workflow run studio.yml --ref main ;;                      # 1:45am New York: tonight's new videos
            08:30) gh workflow run render.yml --ref main -f dry_run=false ;;     # 3:30am: turn tonight's videos into posts (render is demand-driven, so a second run adds nothing)
            09:00|15:00|21:00) gh workflow run topup.yml --ref main -f dry_run=false ;;  # 4am, 10am, 4pm: book them into the day's slots
            # carousel.yml is no longer started here (2026-11-26, docs/brain/reviews/2026-11-26): 33 carousels reached 3-18 people each.
            # Fact reels carry on from the carousels already posted; by hand: gh workflow run carousel.yml -f spec=<name>.
            22:45|01:45) gh workflow run factreel.yml --ref main ;;  # 5:45pm, 8:45pm New York, the account's best hours; 4 a day until 2026-11-26
            06:30) gh workflow run metrics.yml --ref main ;;                     # 1:30am: every account's numbers, Buffer's too
            00:30|03:30|09:30|12:30|15:30|18:30|21:30) gh workflow run metrics.yml --ref main -f instagram_only=true ;;  # every 3 hours: the Instagram accounts' numbers (no Buffer requests)
          esac

      # A dead token or a refused post fails this job every 5 minutes with nobody told.
      # Once an hour is enough to be noticed without burying the channel.
      - name: Say so when publishing fails
        if: failure() && inputs.dry_run != true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          m=$(( 10#$(date -u +%M) )); [ "$m" -lt 5 ] || exit 0
          python - <<'PY' || true
          import os, requests
          from src.notify import extract_webhook_url
          url = extract_webhook_url(os.environ.get("DISCORD_WEBHOOK", ""))
          if url:
              run = "%s/%s/actions/runs/%s" % (os.environ["GITHUB_SERVER_URL"], os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_RUN_ID"])
              requests.post(url, json={"content": "⚠️ ugc-factory: publishing to Instagram is failing. Usually an expired token. " + run}, timeout=20)
          PY
