# Make one video in a given style now and post it: for trying a new look (see studio/post_now.py).
name: try

on:
  workflow_dispatch:
    inputs:
      campaign:
        description: cq_band (close__quarters) or cq_producer (dylancantor23)
        required: true
        default: cq_band
      faces:
        description: 1 = Dylan and Nick as sprites, 0 = without
        required: false
        default: "1"
      song:
        description: song slug (blank = any)
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: publish             # shares the publisher's lock: one sender at a time
  cancel-in-progress: false

jobs:
  factreel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            studio/requirements.txt
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libsndfile1
      - name: Install dependencies
        run: pip install -q -r requirements.txt -r studio/requirements.txt
      - name: Make the reel and hold the post
        id: make
        run: python studio/post_now.py --campaign "${{ inputs.campaign }}" --faces "${{ inputs.faces }}" ${{ inputs.song != '' && format('--song "{0}"', inputs.song) || '' }}
      - name: Record it
        run: |
          git config user.name  "ugc-factory"
          git config user.email "ugc-factory@users.noreply.github.com"
          git add outbox studio/tried.json
          git diff --cached --quiet && exit 0
          git commit -q -m "try held [skip ci]"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
      - name: Send it
        if: steps.make.outputs.account != ''
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_TOKEN_2: ${{ secrets.IG_TOKEN_2 }}
          IG_TOKEN_3: ${{ secrets.IG_TOKEN_3 }}
          IG_TOKEN_4: ${{ secrets.IG_TOKEN_4 }}
        run: python -m src.cli publish-due --account "${{ steps.make.outputs.account }}"
