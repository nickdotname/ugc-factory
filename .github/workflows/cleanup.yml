name: cleanup

# SPEC §5 — delete render Releases older than 14 days.
# SPEC §12 — also posts the weekly digest, which is what keeps silence from
# being ambiguous between "healthy" and "dead".
on:
  workflow_dispatch:
    inputs:
      campaign:
        description: campaign slug (blank = all in the matrix)
        required: false
        default: ""
      digest:
        description: also post the weekly digest
        type: boolean
        default: true
  schedule:
    - cron: "0 6 * * 1"   # Mondays, after the nightly render has settled

permissions:
  contents: write   # deleting Releases requires write

jobs:
  # Campaigns are discovered from the repo rather than listed here, so adding
  # one is a matter of creating campaigns/<slug>/ — no workflow edit, which is
  # what lets the dashboard create campaigns that actually run (SPEC §15).
  discover:
    runs-on: ubuntu-latest
    outputs:
      campaigns: ${{ steps.list.outputs.campaigns }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          slugs=$(find campaigns -mindepth 1 -maxdepth 1 -type d \
                    -not -name '_*' -exec basename {} \; | sort)
          echo "found: $slugs"
          echo "campaigns=$(printf '%s\n' $slugs | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  cleanup:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        campaign: ${{ fromJson(needs.discover.outputs.campaigns) }}
    concurrency:
      group: cleanup-${{ matrix.campaign }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt

      # A dynamic campaign list cannot name its secrets in YAML, so the
      # relevant ones are exported by prefix. Values stay masked in logs; this
      # only widens which STEP can see them, not who can.
      - name: Export campaign secrets
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          echo "$ALL_SECRETS" \
            | jq -r 'to_entries[] | select(.key|test("^(BUFFER|DISCORD)_")) | "\(.key)=\(.value)"' \
            >> "$GITHUB_ENV"

      - name: Delete expired releases and post digest
        if: ${{ inputs.campaign == '' || inputs.campaign == matrix.campaign }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m src.cli cleanup \
            --campaign "${{ matrix.campaign }}" \
            ${{ (inputs.digest == true || github.event_name == 'schedule') && '--digest' || '' }}
