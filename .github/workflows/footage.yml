# Grow the public-domain footage library glitch.archive draws from (studio/footage.py): find films on Wikimedia
# Commons, the Prelinger Archives and NASA, cut short silent pieces with motion in them, upload them to the
# "footage-library" release, and record their sources and licences in studio/footage/index.json.
name: footage

on:
  workflow_dispatch:
    inputs:
      max:
        description: "how many new clips at most"
        default: "40"
  push:
    paths: ["studio/footage.py", "studio/footage/queries.json", ".github/workflows/footage.yml"]
  schedule:
    - cron: "41 9 * * 1"

permissions:
  contents: write

concurrency:
  group: footage
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q numpy opencv-python-headless
      - name: Drop clips the block list or the queries no longer allow
        env:
          GH_TOKEN: ${{ github.token }}
        run: python studio/footage.py purge
      - name: Fetch and cut
        env:
          GH_TOKEN: ${{ github.token }}
        run: python studio/footage.py fetch --max "${{ github.event.inputs.max || '40' }}"
      - name: Keep the index
        run: |
          git config user.name  "ugc-factory"
          git config user.email "ugc-factory@users.noreply.github.com"
          git add studio/footage/index.json
          git diff --cached --quiet && exit 0
          git commit -q -m "footage fetched [skip ci]"
          for i in 1 2 3 4 5; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
