name: metrics

# Fetches performance metrics into campaigns/<slug>/metrics.json once a day.
#
# Deliberately NOT called from the dashboard. Buffer's free plan allows 3,000
# API requests per 30 days and posting three campaigns at 24/day already spends
# ~2,700 of them. One fetch per campaign per day costs 90/month; a dashboard
# querying live would exhaust the remainder in an afternoon and stop the posting
# it exists to measure.
on:
  workflow_dispatch:
    inputs:
      campaign:
        description: campaign slug (blank = all)
        required: false
        default: ""
      days:
        description: aggregation window in days
        required: false
        default: "30"
  schedule:
    # 06:30 UTC — after the nightly render, and late enough that yesterday's
    # posts have had time for the networks to report on them.
    - cron: "30 6 * * *"

permissions:
  contents: write   # commits the metrics cache

jobs:
  # Campaigns are discovered from the repo rather than listed here, so adding
  # one is a matter of creating campaigns/<slug>/ — no workflow edit, which is
  # what lets the dashboard create campaigns that actually run (SPEC §15).
  discover:
    runs-on: ubuntu-latest
    outputs:
      campaigns: ${{ steps.list.outputs.campaigns }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          slugs=$(find campaigns -mindepth 1 -maxdepth 1 -type d \
                    -not -name '_*' -exec basename {} \; | sort)
          echo "found: $slugs"
          echo "campaigns=$(printf '%s\n' $slugs | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  metrics:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        campaign: ${{ fromJson(needs.discover.outputs.campaigns) }}
      # Serialised so three jobs do not race the same branch. Metrics are not
      # time-critical, so waiting is cheaper than rebasing.
      max-parallel: 1
    concurrency:
      group: metrics-${{ matrix.campaign }}-${{ inputs.campaign || 'all' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt

      - name: Fetch metrics
        if: ${{ inputs.campaign == '' || inputs.campaign == matrix.campaign }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_API_KEY_2: ${{ secrets.BUFFER_API_KEY_2 }}
          BUFFER_API_KEY_3: ${{ secrets.BUFFER_API_KEY_3 }}
          BUFFER_API_KEY_4: ${{ secrets.BUFFER_API_KEY_4 }}
          BUFFER_API_KEY_5: ${{ secrets.BUFFER_API_KEY_5 }}
          BUFFER_API_KEY_6: ${{ secrets.BUFFER_API_KEY_6 }}
          BUFFER_API_KEY_7: ${{ secrets.BUFFER_API_KEY_7 }}
          BUFFER_API_KEY_8: ${{ secrets.BUFFER_API_KEY_8 }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m src.cli metrics \
            --campaign "${{ matrix.campaign }}" \
            --days "${{ inputs.days || '30' }}"

      - name: Commit metrics
        run: |
          git config user.name  "ugc-factory"
          git config user.email "ugc-factory@users.noreply.github.com"
          # quota.json too: this job spends two Buffer requests per run and
          # records them, and a ledger written on an ephemeral runner without
          # being committed is gone before anything reads it. --ignore-missing
          # keeps the step working on a run that never got as far as writing it.
          git add --ignore-removal campaigns/${{ matrix.campaign }}/metrics.json
          git add campaigns/${{ matrix.campaign }}/quota.json || true
          if git diff --cached --quiet; then
            echo "no metrics change"
          else
            git commit -m "metrics: ${{ matrix.campaign }} $(date -u +%Y-%m-%d) [skip ci]"
            for i in 1 2 3 4; do
              git push && break
              git pull --rebase || { git rebase --abort; exit 1; }
            done
          fi
