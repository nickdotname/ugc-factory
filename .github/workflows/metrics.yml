name: metrics

# Fetches performance metrics into campaigns/<slug>/metrics.json and posts.json.
#
# Started by publish.yml's clock (GitHub's own schedule skipped days: none ran
# on 2026-11-23): the full run once a day at 06:30 UTC, and an
# Instagram-only run (per-post figures, no Buffer requests) every three hours,
# so the dashboard's numbers are never more than a few hours old.
#
# Deliberately NOT called from the dashboard. Buffer's free plan allows 3,000
# API requests per 30 days and posting three campaigns at 24/day already spends
# ~2,700 of them. One fetch per campaign per day costs 90/month; a dashboard
# querying live would exhaust the remainder in an afternoon and stop the posting
# it exists to measure.
on:
  workflow_dispatch:
    inputs:
      campaign:
        description: campaign slug (blank = all)
        required: false
        default: ""
      days:
        description: aggregation window in days
        required: false
        default: "30"
      instagram_only:
        description: only the per-post figures of the Instagram accounts we post to directly (no Buffer requests)
        type: boolean
        default: false
  # No schedule here: publish.yml starts this at 06:30 UTC (and every three hours
  # for Instagram). A second start from GitHub's cron would spend Buffer's budget twice.

permissions:
  contents: write   # commits the metrics cache

jobs:
  # Campaigns are discovered from the repo rather than listed here, so adding
  # one is a matter of creating campaigns/<slug>/ — no workflow edit, which is
  # what lets the dashboard create campaigns that actually run (SPEC §15).
  discover:
    runs-on: ubuntu-latest
    outputs:
      campaigns: ${{ steps.list.outputs.campaigns }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          slugs=$(find campaigns -mindepth 1 -maxdepth 1 -type d \
                    -not -name '_*' -exec basename {} \; | sort)
          echo "found: $slugs"
          echo "campaigns=$(printf '%s\n' $slugs | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  metrics:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        campaign: ${{ fromJson(needs.discover.outputs.campaigns) }}
      # Serialised so three jobs do not race the same branch. Metrics are not
      # time-critical, so waiting is cheaper than rebasing.
      max-parallel: 1
    concurrency:
      group: metrics-${{ matrix.campaign }}-${{ inputs.campaign || 'all' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt

      - name: Fetch metrics
        if: ${{ inputs.campaign == '' || inputs.campaign == matrix.campaign }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_API_KEY_2: ${{ secrets.BUFFER_API_KEY_2 }}
          BUFFER_API_KEY_3: ${{ secrets.BUFFER_API_KEY_3 }}
          BUFFER_API_KEY_4: ${{ secrets.BUFFER_API_KEY_4 }}
          BUFFER_API_KEY_5: ${{ secrets.BUFFER_API_KEY_5 }}
          BUFFER_API_KEY_6: ${{ secrets.BUFFER_API_KEY_6 }}
          BUFFER_API_KEY_7: ${{ secrets.BUFFER_API_KEY_7 }}
          BUFFER_API_KEY_8: ${{ secrets.BUFFER_API_KEY_8 }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_PAGE_TOKENS: ${{ secrets.IG_PAGE_TOKENS }}
          IG_TOKEN_2: ${{ secrets.IG_TOKEN_2 }}
          IG_TOKEN_3: ${{ secrets.IG_TOKEN_3 }}
          IG_TOKEN_4: ${{ secrets.IG_TOKEN_4 }}
          IG_TOKEN_5: ${{ secrets.IG_TOKEN_5 }}
          IG_TOKEN_6: ${{ secrets.IG_TOKEN_6 }}
          IG_TOKEN_7: ${{ secrets.IG_TOKEN_7 }}
          IG_TOKEN_8: ${{ secrets.IG_TOKEN_8 }}
          IG_TOKEN_9: ${{ secrets.IG_TOKEN_9 }}
          IG_TOKEN_10: ${{ secrets.IG_TOKEN_10 }}
          IG_TOKEN_11: ${{ secrets.IG_TOKEN_11 }}
          IG_TOKEN_12: ${{ secrets.IG_TOKEN_12 }}
          IG_TOKEN_13: ${{ secrets.IG_TOKEN_13 }}
          IG_TOKEN_14: ${{ secrets.IG_TOKEN_14 }}
          IG_TOKEN_15: ${{ secrets.IG_TOKEN_15 }}
          IG_TOKEN_16: ${{ secrets.IG_TOKEN_16 }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m src.cli metrics \
            --campaign "${{ matrix.campaign }}" \
            --days "${{ inputs.days || '30' }}" \
            ${{ inputs.instagram_only == true && '--instagram-only' || '' }}

      - name: Commit metrics
        run: |
          git config user.name  "ugc-factory"
          git config user.email "ugc-factory@users.noreply.github.com"
          # quota.json too: this job spends two Buffer requests per run and
          # records them, and a ledger written on an ephemeral runner without
          # being committed is gone before anything reads it. --ignore-missing
          # keeps the step working on a run that never got as far as writing it.
          # `|| true` on each: a campaign that is paused or in dry run writes
          # none of these, and a missing path must not fail the job — a job
          # that is red every day for a campaign that is not running is how
          # real failures stop being noticed.
          git add --ignore-removal campaigns/${{ matrix.campaign }}/metrics.json || true
          git add campaigns/${{ matrix.campaign }}/quota.json || true
          # posts.json is the per-post metric cache that attribution joins
          # against. It accumulates — Buffer stops returning a post once it
          # falls off the paginated window — so losing it on the runner would
          # quietly shrink the evidence base as the campaign ages.
          git add campaigns/${{ matrix.campaign }}/posts.json || true
          if git diff --cached --quiet; then
            echo "no metrics change"
          else
            git commit -m "metrics: ${{ matrix.campaign }} $(date -u +%Y-%m-%d) [skip ci]"
            bash scripts/push_retry.sh
          fi
