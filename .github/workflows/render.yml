name: render

# SPEC §5 — nightly batch render, ~04:23 UTC. Deliberately off the hour: runs
# scheduled for :00 queue behind everyone else's and were starting 6-8 hours late.
# SPEC §12 — cron drift is real: scheduled workflows routinely fire 5-30 minutes
# late. That is harmless here because Buffer controls actual publish timing, so
# nothing downstream may assume an exact fire time.
on:
  workflow_dispatch:
    inputs:
      campaign:
        description: campaign slug (blank = all in the matrix)
        required: false
        default: ""
      dry_run:
        description: render and upload but never push to Buffer
        type: boolean
        default: true
      count:
        description: override posts_per_day for this run
        required: false
        default: ""
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: write   # commits queue.json/history.json and creates Releases

concurrency:
  # SPEC §12 — two renders for one campaign would double-append history, so the
  # group is per-campaign. It must include the dispatch input: a single
  # workflow-level group only ever holds ONE pending run, so dispatching three
  # campaigns back to back silently cancels the middle one.
  group: render-${{ github.ref }}-${{ inputs.campaign || 'all' }}
  cancel-in-progress: false

jobs:
  # Campaigns are discovered from the repo rather than listed here, so adding
  # one is a matter of creating campaigns/<slug>/ — no workflow edit, which is
  # what lets the dashboard create campaigns that actually run (SPEC §15).
  discover:
    runs-on: ubuntu-latest
    outputs:
      campaigns: ${{ steps.list.outputs.campaigns }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          slugs=$(find campaigns -mindepth 1 -maxdepth 1 -type d \
                    -not -name '_*' -exec basename {} \; | sort)
          echo "found: $slugs"
          echo "campaigns=$(printf '%s\n' $slugs | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  render:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false   # one campaign's failure must not cancel the others
      matrix:
        # SPEC §15 — adding a campaign is one line here.
        campaign: ${{ fromJson(needs.discover.outputs.campaigns) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # SPEC §12 — only render.yml installs ffmpeg; the other jobs do not need it.
      - name: Install ffmpeg
        run: |
          bash scripts/apt_install.sh ffmpeg

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Render batch
        if: ${{ inputs.campaign == '' || inputs.campaign == matrix.campaign }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_API_KEY_2: ${{ secrets.BUFFER_API_KEY_2 }}
          BUFFER_API_KEY_3: ${{ secrets.BUFFER_API_KEY_3 }}
          BUFFER_API_KEY_4: ${{ secrets.BUFFER_API_KEY_4 }}
          BUFFER_API_KEY_5: ${{ secrets.BUFFER_API_KEY_5 }}
          BUFFER_API_KEY_6: ${{ secrets.BUFFER_API_KEY_6 }}
          BUFFER_API_KEY_7: ${{ secrets.BUFFER_API_KEY_7 }}
          BUFFER_API_KEY_8: ${{ secrets.BUFFER_API_KEY_8 }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_PAGE_TOKENS: ${{ secrets.IG_PAGE_TOKENS }}
          IG_TOKEN_2: ${{ secrets.IG_TOKEN_2 }}
          IG_TOKEN_3: ${{ secrets.IG_TOKEN_3 }}
          IG_TOKEN_4: ${{ secrets.IG_TOKEN_4 }}
          IG_TOKEN_5: ${{ secrets.IG_TOKEN_5 }}
          IG_TOKEN_6: ${{ secrets.IG_TOKEN_6 }}
          IG_TOKEN_7: ${{ secrets.IG_TOKEN_7 }}
          IG_TOKEN_8: ${{ secrets.IG_TOKEN_8 }}
          IG_TOKEN_9: ${{ secrets.IG_TOKEN_9 }}
          IG_TOKEN_10: ${{ secrets.IG_TOKEN_10 }}
          IG_TOKEN_11: ${{ secrets.IG_TOKEN_11 }}
          IG_TOKEN_12: ${{ secrets.IG_TOKEN_12 }}
          IG_TOKEN_13: ${{ secrets.IG_TOKEN_13 }}
          IG_TOKEN_14: ${{ secrets.IG_TOKEN_14 }}
          IG_TOKEN_15: ${{ secrets.IG_TOKEN_15 }}
          IG_TOKEN_16: ${{ secrets.IG_TOKEN_16 }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m src.cli render \
            --campaign "${{ matrix.campaign }}" \
            ${{ inputs.dry_run == true && '--dry-run' || '' }} \
            ${{ inputs.count != '' && format('--count {0}', inputs.count) || '' }}

      # SPEC §12 — GitHub disables cron after 60 days with no commits. This
      # nightly commit is what keeps the schedule alive. Do not remove it as an
      # "optimization"; the pipeline would silently stop about two months later.
      - name: Commit queue and history
        # a single-campaign dispatch skips every other campaign's render, and a
        # campaign that has never rendered has no queue.json to add
        if: ${{ inputs.campaign == '' || inputs.campaign == matrix.campaign }}
        run: |
          git config user.name  "ugc-factory"
          git config user.email "ugc-factory@users.noreply.github.com"
          git add campaigns/${{ matrix.campaign }}/queue.json \
                  campaigns/${{ matrix.campaign }}/history.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "render: ${{ matrix.campaign }} $(date -u +%Y-%m-%d) [skip ci]"
            # Campaigns render as parallel matrix jobs and all commit to this
            # one branch, so every job but the first gets a non-fast-forward
            # rejection. Each only touches its own campaigns/<slug>/ files, so
            # rebasing is safe and cannot conflict.
            # (same as scripts/push_retry.sh: never stop on a rebase without
            # pushing it, and fail the job if the commit never lands)
            pushed=""
            for i in $(seq 1 12); do
              if git push; then pushed=1; break; fi
              echo "push rejected, rebasing (attempt $i of 12)"
              sleep $(( (RANDOM % 8) + i ))
              git pull --rebase || { git rebase --abort; exit 1; }
            done
            [ -n "$pushed" ] || { echo "::error::render commit never reached main"; exit 1; }
          fi
