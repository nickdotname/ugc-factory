name: lofi-inbox

# A drop box for finished videos: whatever is pushed to inbox/<library>/hooks/ on this branch (library = the release
# name without "assets-", e.g. math_time-fixation) is checked, named and added to that library by `ugc ingest`, and the
# names it was given are printed.
# Tars pushed to library/ are the dance-footage cut-outs studio/lofi_lib.py reads: they go to the lofi-library release.
on:
  push:
    branches: [lofi-inbox]

permissions:
  contents: write

concurrency:
  group: lofi-inbox
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
      - name: Add the videos to the libraries
        run: |
          # inbox/<release name without "assets-">/hooks/*.mp4: the campaign and song are whichever creative uses that release
          shopt -s nullglob
          for d in inbox/*/; do
            lib=$(basename "$d"); files=("$d"hooks/*.mp4); [ ${#files[@]} -gt 0 ] || continue
            read camp creative < <(LIB="$lib" python -c "
          import glob, os, yaml
          for p in sorted(glob.glob('campaigns/*/config.yaml')):
              c = yaml.safe_load(open(p))
              for x in c.get('creatives') or []:
                  if x.get('assets_release', '').removeprefix('assets-') == os.environ['LIB']:
                      print(c['slug'], x['name']); raise SystemExit
          ")
            [ -n "$creative" ] || { echo "::warning::no creative uses assets-$lib"; continue; }
            echo "== $lib -> $camp / $creative"
            python -m src.cli ingest --campaign "$camp" --creative "$creative" --report "report-$camp-$creative.json"
            cat "report-$camp-$creative.json"; echo
          done
      - name: Add the footage cut-outs to the lofi-library release
        run: |
          shopt -s nullglob
          tars=(library/*.tar); [ ${#tars[@]} -gt 0 ] || exit 0
          gh release view lofi-library >/dev/null 2>&1 || gh release create lofi-library --title "lofi-library" --notes "Dance-footage cut-outs for studio/lofi_video.py and studio/cursor_video.py (studio/lofi/index.json)."
          gh release upload lofi-library "${tars[@]}" --clobber
          gh release view lofi-library --json assets --jq '.assets[] | "\(.name) \(.size)"'
