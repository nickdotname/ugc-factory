name: factreel

# Posts one fact reel: a carousel already on the profile told in 15 seconds over
# the audio-reactive visuals and a stretch of a song (studio/post_factreel.py).
# Started twice a day by the publish job (5:45pm and 8:45pm New York; four times
# until 2026-11-26), for nostalgia.hub.vhs and psychedelic.station only, and on
# psychedelic.station only from specs that are not about drugs (DRUGS in the
# script). Does nothing when every eligible carousel already has its reels.
on:
  workflow_dispatch:
    inputs:
      spec:
        description: which carousel's slug (blank = oldest posted carousel without a reel)
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: publish             # shares the publisher's lock: one sender at a time
  cancel-in-progress: false

jobs:
  factreel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      SPEC: ${{ inputs.spec }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            studio/requirements.txt
      - name: Install ffmpeg
        run: bash scripts/apt_install.sh ffmpeg libsndfile1
      - name: Install dependencies
        run: pip install -q -r requirements.txt -r studio/requirements.txt
      - name: Make the reel and hold the post
        id: make
        run: python studio/post_factreel.py ${SPEC:+--spec "$SPEC"}
      - name: Record it
        run: |
          git config user.name  "ugc-factory"
          git config user.email "ugc-factory@users.noreply.github.com"
          git add outbox studio/carousels/reeled.json
          git diff --cached --quiet && exit 0
          git commit -q -m "fact reel held [skip ci]"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
      - name: Send it
        if: steps.make.outputs.accounts != ''
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_PAGE_TOKENS: ${{ secrets.IG_PAGE_TOKENS }}
          IG_TOKEN_2: ${{ secrets.IG_TOKEN_2 }}
          IG_TOKEN_3: ${{ secrets.IG_TOKEN_3 }}
          IG_TOKEN_4: ${{ secrets.IG_TOKEN_4 }}
          IG_TOKEN_5: ${{ secrets.IG_TOKEN_5 }}
          IG_TOKEN_6: ${{ secrets.IG_TOKEN_6 }}
        run: |
          for a in ${{ steps.make.outputs.accounts }}; do python -m src.cli publish-due --account "$a" || echo "::warning::$a did not publish"; done
