name: rocket-inbox

# A drop box for rocket.league.lit's clips: what is pushed to clips/ on this branch, or listed in drive.txt (Drive files
# shared by link: "<file id> <name>"), is analysed and added to the rocket-library release by studio/rocket_lib.py,
# and the library's index (studio/rocket/index.json) is committed to main.
on:
  push:
    branches: [rocket-inbox]

permissions:
  contents: write

concurrency:
  group: rocket-inbox
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: inbox
      - uses: actions/checkout@v4
        with:
          ref: main
          path: repo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q numpy
      - name: Fetch the clips listed in drive.txt
        run: |
          mkdir -p inbox/clips
          grep -v '^#' inbox/drive.txt 2>/dev/null | while read -r id name; do
            [ -z "$id" ] && continue
            [ -f "inbox/clips/$name" ] && continue
            curl -sSfL --retry 3 -o "inbox/clips/$name" "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t"
            echo "$name: $(stat -c %s "inbox/clips/$name") bytes, $(file -b --mime-type "inbox/clips/$name")"
          done
      - name: Add the clips to the library
        run: cd repo && python studio/rocket_lib.py add ../inbox/clips
      - name: Record the library
        run: |
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio/rocket/index.json
          git diff --cached --quiet && exit 0
          git commit -q -m "rocket library: new clips [skip ci]"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
