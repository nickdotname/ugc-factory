# Fetch the photos the carousel specs and the songs' pictures.json name (Wikimedia Commons, free licences only) into studio/photos/,
# so posting never depends on Wikimedia answering GitHub's servers at that moment (it often refuses them).
name: photos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["studio/carousels/**", "studio/songs/*/pictures.json"]
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: write

concurrency:
  group: photos
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q Pillow
      - name: Fetch what is missing
        env:
          CQ_PHOTO_FETCH: "1"
        run: python studio/photos.py fetch
      - name: Keep them
        run: |
          git config user.name  "ugc-factory"
          git config user.email "ugc-factory@users.noreply.github.com"
          git add studio/photos
          git diff --cached --quiet && exit 0
          git commit -q -m "photos fetched [skip ci]"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
