# Grow the museum-zoom page's library (studio/art.py): public-domain / CC0 paintings and prints from The Met, the
# Cleveland Museum of Art and the Art Institute of Chicago, at full size, uploaded to the "art-library" release and
# recorded with their museum, licence and page in studio/art/index.json.
name: art

on:
  workflow_dispatch:
    inputs:
      max:
        description: "how many new works at most"
        default: "60"
  push:
    branches: [main]
    paths: ["studio/art.py", "studio/art/queries.json", ".github/workflows/art.yml"]

permissions:
  contents: write

concurrency:
  group: art
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q numpy opencv-python-headless
      - name: Fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python studio/art.py fetch --max "${{ github.event.inputs.max || '60' }}"
      - name: Keep the index
        run: |
          git config user.name  "ugc-factory"
          git config user.email "ugc-factory@users.noreply.github.com"
          git add studio/art/index.json
          git diff --cached --quiet && exit 0
          git commit -q -m "art fetched [skip ci]"
          for i in 1 2 3 4 5; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
