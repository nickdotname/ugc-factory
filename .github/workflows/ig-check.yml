# Which Instagram accounts can their tokens reach, and what may each token read? (scripts/ig_check.py)
# Run by hand after adding an account or a token: it prints, per account, the username Instagram answers with and
# which host the token works on; then, per token, its permissions (flagged when the insights permission is missing,
# which is why an account has no numbers) and the Pages it manages with their tasks (no ANALYZE = no insights).
# No token is ever printed. Red means something to fix: a token that cannot reach its account or read its insights.
name: ig-check

on:
  workflow_dispatch:
    inputs:
      accounts:
        description: "account names from accounts.yaml, space-separated (empty = all)"
        default: ""
  push:
    branches: [ig-check]          # a scratch branch: push there to try a change to the check itself

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests pyyaml
      - name: Ask Instagram who each token is for
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_PAGE_TOKENS: ${{ secrets.IG_PAGE_TOKENS }}
          IG_TOKEN_2: ${{ secrets.IG_TOKEN_2 }}
          IG_TOKEN_3: ${{ secrets.IG_TOKEN_3 }}
          IG_TOKEN_4: ${{ secrets.IG_TOKEN_4 }}
          IG_TOKEN_5: ${{ secrets.IG_TOKEN_5 }}
          IG_TOKEN_6: ${{ secrets.IG_TOKEN_6 }}
          IG_TOKEN_7: ${{ secrets.IG_TOKEN_7 }}
          IG_TOKEN_8: ${{ secrets.IG_TOKEN_8 }}
          IG_TOKEN_9: ${{ secrets.IG_TOKEN_9 }}
          IG_TOKEN_10: ${{ secrets.IG_TOKEN_10 }}
          IG_TOKEN_11: ${{ secrets.IG_TOKEN_11 }}
          IG_TOKEN_12: ${{ secrets.IG_TOKEN_12 }}
          IG_TOKEN_13: ${{ secrets.IG_TOKEN_13 }}
          IG_TOKEN_14: ${{ secrets.IG_TOKEN_14 }}
          IG_TOKEN_15: ${{ secrets.IG_TOKEN_15 }}
          IG_TOKEN_16: ${{ secrets.IG_TOKEN_16 }}
          ACCOUNTS: ${{ inputs.accounts }}
        run: python scripts/ig_check.py $ACCOUNTS
