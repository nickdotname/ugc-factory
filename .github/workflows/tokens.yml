# Refresh the Instagram tokens before they run out (scripts/refresh_tokens.py) and write them back into the
# secrets, so nobody has to press Generate token and paste again. Needs SECRETS_PAT (a fine-grained token for
# this repository with only "Secrets: read and write"); META_APP_SECRET (the app's secret) lets it renew the Facebook-format ones.
name: tokens

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 1,15 * *"     # twice a month: tokens last 60 days
    - cron: "41 9 * * 1"        # weekly: picks up Pages linked since

permissions:
  contents: read

concurrency:
  group: tokens
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh and store
        env:
          SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_PAGE_TOKENS: ${{ secrets.IG_PAGE_TOKENS }}
          IG_TOKEN_2: ${{ secrets.IG_TOKEN_2 }}
          IG_TOKEN_3: ${{ secrets.IG_TOKEN_3 }}
          IG_TOKEN_4: ${{ secrets.IG_TOKEN_4 }}
          IG_TOKEN_5: ${{ secrets.IG_TOKEN_5 }}
          IG_TOKEN_6: ${{ secrets.IG_TOKEN_6 }}
          IG_TOKEN_7: ${{ secrets.IG_TOKEN_7 }}
          IG_TOKEN_8: ${{ secrets.IG_TOKEN_8 }}
          IG_TOKEN_9: ${{ secrets.IG_TOKEN_9 }}
          IG_TOKEN_10: ${{ secrets.IG_TOKEN_10 }}
          IG_TOKEN_11: ${{ secrets.IG_TOKEN_11 }}
          IG_TOKEN_12: ${{ secrets.IG_TOKEN_12 }}
          IG_TOKEN_13: ${{ secrets.IG_TOKEN_13 }}
          IG_TOKEN_14: ${{ secrets.IG_TOKEN_14 }}
          IG_TOKEN_15: ${{ secrets.IG_TOKEN_15 }}
          IG_TOKEN_16: ${{ secrets.IG_TOKEN_16 }}
        run: python scripts/refresh_tokens.py
      - name: Never-expiring Page tokens for every account on a Facebook Page
        if: always()
        env:
          SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/page_tokens.py
