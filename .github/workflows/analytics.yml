name: analytics

# Fetches the product's acquisition figures and lines them up against the days
# this repo posted. Read-only: the admin API is GET/OPTIONS only.
#
# Daily, after metrics, so the join has that morning's view figures rather than
# yesterday's. Also dispatchable.
on:
  schedule:
    - cron: "40 12 * * *"
  workflow_dispatch:
    inputs:
      campaign:
        description: campaign slug (blank = all with analytics configured)
        required: false
        default: ""
      days:
        description: how many days back to fetch
        required: false
        default: "30"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      campaigns: ${{ steps.list.outputs.campaigns }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          slugs=$(find campaigns -mindepth 1 -maxdepth 1 -type d \
                    -not -name '_*' -exec basename {} \; | sort)
          echo "found: $slugs"
          echo "campaigns=$(printf '%s\n' $slugs | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  analytics:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        campaign: ${{ fromJson(needs.discover.outputs.campaigns) }}
      # Serialised: each run commits campaigns/, and parallel jobs would race
      # the push the way topup does.
      max-parallel: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt

      - name: Analytics
        # A campaign with no analytics block prints why and exits 0, so the
        # matrix stays green for campaigns with no product behind them. A
        # campaign that IS configured but has no key does fail, which is the
        # signal you want.
        if: ${{ inputs.campaign == '' || inputs.campaign == matrix.campaign }}
        env:
          CLUBS_API_KEY: ${{ secrets.CLUBS_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python -m src.cli analytics --campaign "${{ matrix.campaign }}" \
            --days "${{ inputs.days || '30' }}"

      - name: Commit the cache
        if: ${{ inputs.campaign == '' || inputs.campaign == matrix.campaign }}
        run: |
          git config user.name  "ugc-factory"
          git config user.email "ugc-factory@users.noreply.github.com"
          git add campaigns/
          git diff --cached --quiet && exit 0
          git commit -m "analytics ${{ matrix.campaign }} [skip ci]"
          git pull --rebase --autostash
          git push
