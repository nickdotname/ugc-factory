# Takes files dropped into the hosted dashboard and adds them to a creative's
# clip library.
#
# The dashboard cannot be trusted to know what a file is — a browser will
# happily upload a renamed PDF as "clip.mp4" — and it has no ffmpeg to find
# out. So it leaves uploads in a holding release (inbox-<library>), and this
# job does what `ugc ingest` does on a laptop: probe each file, refuse what
# cannot play, give the rest their proper names, and upload them to the
# library the renderer draws from.
name: ingest

on:
  workflow_dispatch:
    inputs:
      campaign:
        description: campaign slug
        required: true
      creative:
        description: which creative's library
        required: true
        default: default

permissions:
  contents: write   # reads the holding release, writes the library release

concurrency:
  # Two runs for one library would hand out the same clip numbers.
  group: ingest-${{ inputs.campaign }}-${{ inputs.creative }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      # Through the environment, never interpolated into a script.
      CAMPAIGN: ${{ inputs.campaign }}
      CREATIVE: ${{ inputs.creative }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            campaigns
            accounts.yaml
            requirements.txt
            fonts
            site.yaml
            inbox
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ffmpeg
        run: |
          bash scripts/apt_install.sh ffmpeg

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Collect the dropped files
        run: |
          # A song that shares the campaign's videos has two holding areas:
          # its own (the track) and the campaign's (videos for the pool).
          python -c "
          import os
          from pathlib import Path
          from src.config import load_campaign
          c = load_campaign(Path('campaigns'), os.environ['CAMPAIGN'])
          cr = next(x for x in c.creatives if x.name == os.environ['CREATIVE'])
          keys = [c.creative_library_key(cr)]
          if c.creative_video_tag(cr) != c.creative_assets_tag(cr):
              keys.append(c.library_key)
          print('\n'.join(dict.fromkeys(keys)))
          " > keys.txt
          : > collected.txt
          shopt -s nullglob
          while read -r KEY; do
            mkdir -p "staged/$KEY" "inbox/$KEY/hooks" "inbox/$KEY/bodies" "inbox/$KEY/music"
            if ! gh release view "inbox-$KEY" >/dev/null 2>&1; then
              echo "Nothing waiting in inbox-$KEY."
              continue
            fi
            gh release download "inbox-$KEY" --dir "staged/$KEY" --pattern '*' || true
            for f in "staged/$KEY"/*; do
              base=$(basename "$f")
              # Exactly what this run picked up, so the last step removes
              # these and nothing dropped while the job was running.
              case "${base%%__*}" in
                hook) dir=hooks ;;
                body) dir=bodies ;;
                music) dir=music ;;
                # Anything else is a file already refused on an earlier run,
                # kept so the dashboard can say why.
                *) continue ;;
              esac
              printf '%s\t%s\n' "$KEY" "$base" >> collected.txt
              mv "$f" "inbox/$KEY/$dir/${base#*__}"
            done
          done < keys.txt
          find inbox -type f | sort

      - name: Check, name and add to the library
        run: |
          set +e
          python -m src.cli ingest --campaign "$CAMPAIGN" --creative "$CREATIVE" --report ingest.json 2>ingest.log | tee ingest.out
          {
            echo "### Uploads for $CAMPAIGN / $CREATIVE"
            echo '```'
            cat ingest.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ ! -s collected.txt ]; then
            echo "Nothing was waiting."
            exit 0
          fi
          # No report means nothing was settled — a broken config, a failed
          # upload. Fail loudly and leave every file where it is, so the
          # dashboard shows the failure and the next run picks them up.
          if [ ! -s ingest.json ]; then
            tail -n 40 ingest.log
            echo "::error::The dropped files could not be checked. They are still waiting."
            exit 1
          fi

      - name: Empty the holding area
        run: |
          [ -s collected.txt ] && [ -s ingest.json ] || exit 0
          while IFS=$'\t' read -r key name; do
            verdict=$(jq -r --arg k "$key" --arg n "$name" \
              '[.[] | select(.inbox == $k and .asset == $n)][0].verdict // ""' ingest.json)
            case "$verdict" in
              ok|warned)
                gh release delete-asset "inbox-$key" "$name" --yes || true ;;
              rejected)
                # Kept under a new name with the reason attached, so the
                # dashboard can tell whoever dropped it what was wrong.
                reason=$(jq -r --arg k "$key" --arg n "$name" \
                  '[.[] | select(.inbox == $k and .asset == $n)][0].notes | join(" ")' ingest.json)
                id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/inbox-$key" \
                  | jq -r --arg n "$name" '.assets[] | select(.name == $n) | .id')
                [ -n "$id" ] && gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$id" \
                  -f name="rejected__$name" -f label="${reason:0:180}" >/dev/null \
                  || gh release delete-asset "inbox-$key" "$name" --yes || true ;;
              *)
                echo "Leaving $name where it is: it was not looked at." ;;
            esac
          done < collected.txt

      # Files can also arrive by being committed under inbox/<library>/ — the
      # same folder `ugc ingest` reads on a laptop. Once they are in the
      # library they come out of the repo, or the next run would add them again.
      - name: Clear dropped files that were committed to the repo
        run: |
          [ -s ingest.json ] || exit 0
          while read -r KEY; do
            git rm -r -q --ignore-unmatch "inbox/$KEY" || true
          done < keys.txt
          git diff --cached --quiet && exit 0
          git config user.name  "ugc-factory"
          git config user.email "ugc-factory@users.noreply.github.com"
          git commit -q -m "ingest: clear inbox for $CAMPAIGN/$CREATIVE [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            git push -q && exit 0
            git pull -q --rebase
            sleep $(( (RANDOM % 6) + 2 ))
          done
          echo "::error::Could not remove the ingested files from the repo."
          exit 1
