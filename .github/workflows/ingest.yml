# Takes files dropped into the hosted dashboard and adds them to a creative's
# clip library.
#
# The dashboard cannot be trusted to know what a file is — a browser will
# happily upload a renamed PDF as "clip.mp4" — and it has no ffmpeg to find
# out. So it leaves uploads in a holding release (inbox-<library>), and this
# job does what `ugc ingest` does on a laptop: probe each file, refuse what
# cannot play, give the rest their proper names, and upload them to the
# library the renderer draws from.
name: ingest

on:
  workflow_dispatch:
    inputs:
      campaign:
        description: campaign slug
        required: true
      creative:
        description: which creative's library
        required: true
        default: default

permissions:
  contents: write   # reads the holding release, writes the library release

concurrency:
  # Two runs for one library would hand out the same clip numbers.
  group: ingest-${{ inputs.campaign }}-${{ inputs.creative }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      # Through the environment, never interpolated into a script.
      CAMPAIGN: ${{ inputs.campaign }}
      CREATIVE: ${{ inputs.creative }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            campaigns
            accounts.yaml
            requirements.txt
            fonts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Collect the dropped files
        id: collect
        run: |
          KEY=$(python -c "
          import os
          from pathlib import Path
          from src.config import load_campaign
          c = load_campaign(Path('campaigns'), os.environ['CAMPAIGN'])
          cr = next(x for x in c.creatives if x.name == os.environ['CREATIVE'])
          print(c.creative_library_key(cr))
          ")
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          mkdir -p staged "inbox/$KEY/hooks" "inbox/$KEY/bodies" "inbox/$KEY/music"
          if ! gh release view "inbox-$KEY" >/dev/null 2>&1; then
            echo "Nothing has been dropped for this library."
            exit 0
          fi
          gh release download "inbox-$KEY" --dir staged --pattern '*' || true
          # Exactly what this run picked up — so the last step removes these
          # and nothing dropped while the job was running.
          ls -1 staged > collected.txt 2>/dev/null || true
          shopt -s nullglob
          for f in staged/*; do
            base=$(basename "$f")
            case "${base%%__*}" in
              hook) dir=hooks ;;
              body) dir=bodies ;;
              music) dir=music ;;
              *) continue ;;
            esac
            mv "$f" "inbox/$KEY/$dir/${base#*__}"
          done
          find "inbox/$KEY" -type f | sort

      - name: Check, name and add to the library
        run: |
          set +e
          python -m src.cli ingest --campaign "$CAMPAIGN" --creative "$CREATIVE" 2>ingest.log | tee ingest.out
          status=${PIPESTATUS[0]}
          {
            echo "### Uploads for $CAMPAIGN / $CREATIVE"
            echo '```'
            cat ingest.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # A rejected file is reported, not a reason to leave the good ones
          # behind: they are already in the library by this point.
          if [ "$status" -ne 0 ]; then
            echo "::warning::Some dropped files could not be used. See the summary."
          fi
          exit 0

      - name: Empty the holding area
        env:
          KEY: ${{ steps.collect.outputs.key }}
        run: |
          [ -s collected.txt ] || exit 0
          while read -r name; do
            gh release delete-asset "inbox-$KEY" "$name" --yes || true
          done < collected.txt
