name: topup

# SPEC §4.1 — Buffer's free plan caps *queue depth* at 10 per channel, not posts
# per day. This job tops the queue back up to that cap; Buffer's own scheduler
# decides when each post actually publishes.
on:
  workflow_dispatch:
    inputs:
      campaign:
        description: campaign slug (blank = all in the matrix)
        required: false
        default: ""
      dry_run:
        description: plan the pushes without contacting Buffer
        type: boolean
        default: true
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write   # the `claimed` commit is the crash-resume guarantee

jobs:
  # Campaigns are discovered from the repo rather than listed here, so adding
  # one is a matter of creating campaigns/<slug>/ — no workflow edit, which is
  # what lets the dashboard create campaigns that actually run (SPEC §15).
  discover:
    runs-on: ubuntu-latest
    outputs:
      campaigns: ${{ steps.list.outputs.campaigns }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          slugs=$(find campaigns -mindepth 1 -maxdepth 1 -type d \
                    -not -name '_*' -exec basename {} \; | sort)
          echo "found: $slugs"
          echo "campaigns=$(printf '%s\n' $slugs | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  topup:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        campaign: ${{ fromJson(needs.discover.outputs.campaigns) }}
      # Serialised. Each campaign commits TWICE PER ITEM — claim before the
      # push, result after — which is the crash-resume guarantee and cannot be
      # batched away. Three parallel jobs therefore put ~60 pushes on one
      # branch and starve each other out even with rebase-retry. The jobs take
      # about a minute each, so waiting is far cheaper than contending.
      max-parallel: 1
    # SPEC §12 — two top-up jobs racing the same queue would double-push, and a
    # duplicate that reaches Instagram cannot be recalled.
    concurrency:
      # Per campaign, and including the dispatch input: a group only ever holds
      # one pending run, so three back-to-back single-campaign dispatches would
      # evict the middle one. Dispatching with a blank campaign runs all three
      # in this one matrix and is the preferred way to trigger it by hand.
      group: topup-${{ matrix.campaign }}-${{ inputs.campaign || 'all' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # A dynamic campaign list cannot name its secrets in YAML, so the
      # relevant ones are exported by prefix. Values stay masked in logs; this
      # only widens which STEP can see them, not who can.
      - name: Export campaign secrets
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          echo "$ALL_SECRETS" \
            | jq -r 'to_entries[] | select(.key|test("^(BUFFER|DISCORD)_")) | "\(.key)=\(.value)"' \
            >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Top up Buffer queue
        if: ${{ inputs.campaign == '' || inputs.campaign == matrix.campaign }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name  "ugc-factory"
          git config user.email "ugc-factory@users.noreply.github.com"
          python -m src.cli topup \
            --campaign "${{ matrix.campaign }}" \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}
