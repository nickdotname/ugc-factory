slug: clubs
timezone: America/New_York

posting:
  # Sized to the actual library: ~6 hooks, ~3 bodies, 5 music, 5 captions.
  #
  #   6 × 3 × 5 × 5 = 450 combinations = 225 days at 2/day.
  #
  # The binding constraint is not the combination count, it is the cooldowns
  # below — a cooldown of N days at P posts/day needs N×P distinct assets to
  # never repeat inside the window. At 6/day this library would relax its
  # dedupe rules on day one and alert every day thereafter (SPEC §10), which
  # is why the cadence is 2 and not the spec's default 6.
  #
  # To raise this: write more captions first. They are plain text and are the
  # cheapest dimension to grow by far. At 25 captions this supports 6/day.
  posts_per_day: 2
  start_hour: 9
  end_hour: 22
  max_buffer_queue: 10        # SPEC §4.1 — Buffer free-plan queue-depth cap
  dry_run: true               # flip to false after a dry run looks right

video:
  width: 1080
  height: 1920
  fps: 30
  crf: 23
  preset: veryfast
  min_duration_sec: 5         # SPEC §4.3 — Reels-tab eligibility floor
  max_duration_sec: 90        # SPEC §4.3 — Reels-tab eligibility ceiling
  max_file_mb: 100

composition:
  bodies_per_video: 1
  music_volume: 0.10          # flat across the whole video, no ducking
  music_fade_out_sec: 1.5

selection:
  dedupe_on: [hook, body, music, caption]
  # Both cooldowns are sized so posts_per_day × cooldown stays under the number
  # of assets available, which is what keeps the selector from ever relaxing.
  # With 5 captions at 2/day, a 2-day cooldown needs 4 — fits with one spare.
  # Raise these as the library grows; they are the first thing to tighten once
  # there are more captions.
  caption_cooldown_days: 2
  hook_cooldown_days: 2
  min_runway_days: 90         # preflight fails under this many days of combos

buffer:
  api_key_secret: BUFFER_API_KEY
  channel_id_secret: BUFFER_CHANNEL_CLUBS
  post_type: reel             # verified against Buffer's PostType enum, README §0

notify:
  webhook_secret: DISCORD_WEBHOOK_CLUBS
  on: [failure, queue_empty, quota_high, license_missing, dedupe_relaxed]
