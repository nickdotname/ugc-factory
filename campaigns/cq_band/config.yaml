# Lyric videos for @close__quarters (studio/lyric_video.py, "band" style): a
# retro desktop where each lyric line gets its own window, with the words
# lighting up in time and "EDUCATION, lesson N of 15" on screen.
#
# Finished videos with their own sound: nothing is laid over them and no line
# is drawn on top. One creative per SONG, so a caption always names the song
# playing. What each clip is made of is in recipes.json beside this file.

slug: cq_band
timezone: America/New_York

creatives:
  - name: full_ride
    title: "Full Ride"
    assets_release: assets-cq_band-full_ride-v2
  - name: hair_of_the_dog
    title: "Hair of the Dog"
    assets_release: assets-cq_band-hair_of_the_dog-v2
  - name: talk
    title: "Talk"
    assets_release: assets-cq_band-talk-v2
  - name: fixation
    title: "Fixation"
    assets_release: assets-cq_band-fixation-v2
  - name: wont_be_the_same_again
    title: "Won't Be the Same Again"
    assets_release: assets-cq_band-wont_be_the_same_again-v2
  - name: myth_of_sisyphus
    title: "Myth of Sisyphus"
    assets_release: assets-cq_band-myth_of_sisyphus-v2
  - name: suspended
    title: "Suspended"
    assets_release: assets-cq_band-suspended-v2
  - name: prologue
    title: "Prologue: Before"
    assets_release: assets-cq_band-prologue-v2
  - name: subway_maintenance
    title: "Subway Maintenance"
    assets_release: assets-cq_band-subway_maintenance
  - name: silver_and_gold
    title: "Silver and Gold"
    assets_release: assets-cq_band-silver_and_gold
  - name: evil_close_quarters
    title: "Evil Close Quarters"
    assets_release: assets-cq_band-evil_close_quarters
  - name: notta_problem
    title: "Notta Problem"
    assets_release: assets-cq_band-notta_problem

# close__quarters only, posted to Instagram directly as trial reels.
accounts:
  mode: allow
  names: [close_quarters_ig]

posting:
  posts_per_day: 3            # cutout 2 + band 1 a day (docs/brain/reviews/2026-11-26); 8 until then
  start_hour: 9
  end_hour: 23
  max_buffer_queue: 10
  max_backlog_days: 1
  # Keeps these posts off the minute another campaign uses on the same
  # accounts.
  slot_offset_min: 50
  fan_out: true
  # Both switches are ON so nothing can post until you have looked at a
  # sample. To go live: paused -> false, then dry_run -> false.
  paused: false
  dry_run: false

video:
  width: 1080
  height: 1920
  fps: 30
  crf: 21
  preset: veryfast
  min_duration_sec: 5
  max_duration_sec: 60
  max_file_mb: 100

composition:
  bodies_per_video: 0          # one clip per video
  loop_to_min: false           # the renders are already the right length
  music_volume: 0.0            # nothing laid over: the song is in the video
  clip_volume: 1.0             # the video's own sound IS the song
  music_cleared: true          # it is your music
  music_fade_in_sec: 0.05      # a cue should hit, not swell
  music_fade_out_sec: 0.4
  music_random_start: true     # only for tracks with no music_cues
  music_segment_sec: 15
  music_skip_intro_sec: 0

variation:
  enabled: true
  # Every account gets its OWN version of each post. What differs between
  # them is real: a different clip, a different on-screen line and caption,
  # a different moment of the song — as far as the song's library has spares.
  # This is what keeps accounts from posting the same video; the cosmetic
  # knobs below do not do that on their own (see PLAYBOOK §8).
  per_account: false          # one account per network now, so each post is
                              # one render sent to all three. Turn back on if a
                              # second account on the same network is added.
  per_account_vary: [clip, caption, cue]

  # Cosmetic differences on top. Set any of them to 0 to switch it off.
  zoom_max: 0              # punch-in, up to 5%
  rotate_max_deg: 0
  brightness_max: 0
  saturation_max: 0
  hue_max_deg: 0
  grain_max: 0
  trim_start_max_sec: 0     # shave the head of the clip
  overlay_shift_max: 0     # a small nudge only: the line sits just above the clips' own text
  allow_mirror: false         # would flip any text in the footage

  # Never touched: it is the song, and the platforms recognising it as the
  # song is the point.
  speed_max: 0.0
  music_tempo_max: 0.0
  music_tilt_db: 0.0

overlay:
  enabled: false              # the lyrics are already on screen
  size: 0.05
  # High on the frame on purpose: several of the clips already have their own
  # text burned in around a quarter of the way down, and this sits above it.
  y: 0.085
  max_chars: 24

# Where every post sends people. {name} and {link} come from the song's own
# `title:` and `link:` under creatives, or from here when a song has none.
funnel:
  name: Education by Close Quarters
  link: ""                    # your smart link — fill this in before going live
  cta:
    - "link in bio to stream {name}"
    - "stream {name}: link in bio"
    - "{name} is out now. link in bio to stream it"
  cta_by_network:
    youtube:                  # YouTube descriptions carry a real link
      - "Full song — {name}: {link}"
      - "Listen to {name}: {link}"
  cta_every: 1
  # Posted by the account itself under each reel right after it goes out (Instagram only;
  # Buffer's free plan refuses posts that carry one). Rotates; no asks for likes or tags.
  first_comment:
    - "{name} is on EDUCATION, our album about college at NYU. out now everywhere 🎧"
    - "{name}, from EDUCATION. the whole album is linked in our bio"
    - "EDUCATION is out now. {name} is just one of them, link in bio"
  # What each reel's sound is called on Instagram instead of "Original audio".
  audio_name: "{name} – Close Quarters"
  end_card: ""               # the render loops cleanly; a card would break the loop
  end_card_sec: 2.0

selection:
  # The band's own dance footage (studio/lofi/index.json) is scarce and is what people come here for: those clips
  # are three times likelier than a song's other clips (src/cli.py _style_boost, from recipes.json).
  favour_styles: {lofi: 3, cutout: 3}
  dedupe_on: [hook]          # each video once: a new caption does not make it a new post
  repeats: false             # and never again later, even when the library runs short (the slot stays empty)
  caption_cooldown_days: 0
  hook_cooldown_days: 4      # a video is not posted again for four days; raise as the library grows
  min_runway_days: 7
  performance_weight: 0.5
  performance_statistic: mean
  # false = post ONLY what lineup.yaml spells out.
  auto_fill: true

# Legacy single-channel binding. Fan-out posts through accounts.yaml; this
# only decides which network's limits captions are checked against first.
buffer:
  api_key_secret: BUFFER_API_KEY
  channel_id: 6a7d1f03b2d9d57743694aa7
  post_type: reel
  service: instagram
  organization_id: 6a1dc863e8cbb15ba8fdb4ab
  title_strategy: derive

notify:
  webhook_secret: DISCORD_WEBHOOK
  on: [failure, queue_empty, quota_high, license_missing, dedupe_relaxed,
       queue_stale, distribution_lost, schedule_gap, digest]
