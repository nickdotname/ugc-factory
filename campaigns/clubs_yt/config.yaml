slug: clubs_yt
timezone: America/Denver
# Shares ONE asset library with the other clubs campaigns — the same
# clips go to every network, so duplicating the Release would mean
# uploading every file three times and keeping them in sync by hand.
assets_release: assets-clubs

posting:
  slot_offset_min: 80
  # 12/day = one post every two hours across the 24-hour window below.
  #
  # 6 hooks x 4 bodies x 33 music beds x 25 captions = 19,800 combinations,
  # which is well over a thousand days before dedupe has to repeat anything.
  #
  # Halving the cadence from 24 also halves API spend (1,620 of Buffer's
  # 3,000/30 days, against 2,700 before) and halves how often a viewer sees
  # the same hook.
  posts_per_day: 12
  # One post an hour, starting 15:00 Mountain. start == end means a FULL
  # 24-hour window beginning at that hour, so the run wraps past midnight and
  # the later slots land on the following calendar day.
  start_hour: 15
  end_hour: 15
  max_buffer_queue: 10        # SPEC §4.1 — Buffer free-plan queue-depth cap
  # LIVE. Posts are pushed to Buffer and publish on their scheduled slot.
  # Set back to true to pause posting without touching the workflows; the
  # render job keeps building batches either way.
  dry_run: false

video:
  width: 1080
  height: 1920
  fps: 30
  crf: 23
  preset: veryfast
  min_duration_sec: 5         # SPEC §4.3 — Reels-tab eligibility floor
  max_duration_sec: 90        # SPEC §4.3 — Reels-tab eligibility ceiling
  max_file_mb: 100

composition:
  bodies_per_video: 1
  music_volume: 0.10          # flat across the whole video, no ducking
  music_fade_out_sec: 1.5

  # Upload WHOLE SONGS, not hand-cut viral snippets. Each video takes its bed
  # from a random point in the track, so one 3-minute song becomes ~12 distinct
  # beds instead of one.
  music_random_start: true
  music_segment_sec: 15        # offsets snap to this grid, so they stay dedupe-able
  music_skip_intro_sec: 0      # raise to skip sparse intros
  music_fade_in_sec: 0.5       # stops a mid-phrase start from popping

selection:
  dedupe_on: [hook, body, music, caption]
  # A cooldown of N days at P posts/day needs N x P distinct assets or the
  # selector relaxes and alerts daily. At 24/day:
  #   captions: 2 days needs 24, and there are 25 — fits with one spare.
  #   hooks:    1 day would need 12, and there are 6 — so it must still be 0.
  # Hook cooldown 0 does not mean hooks repeat back to back; full-tuple dedupe
  # still applies. It means the selector will not additionally space them out.
  # Raise both as the hook library grows.
  caption_cooldown_days: 2
  hook_cooldown_days: 0
  min_runway_days: 90         # preflight fails under this many days of combos

buffer:
  api_key_secret: BUFFER_API_KEY
  # Not a secret: identifies the channel but grants nothing without
  # the API key. In config so the workflows can name a fixed set of
  # secrets regardless of how many campaigns exist.
  channel_id: 6a1dca06c687a22dd44c7f8a
  post_type: short
  service: youtube
  organization_id: 6a1dc863e8cbb15ba8fdb4ab   # saves 540 API requests/month
  # Only used by services with a separate title field (youtube).
  #   derive  = take the description's first line, cut at a word boundary
  #   require = every record must carry an explicit `title:` line
  title_strategy: derive

notify:
  webhook_secret: DISCORD_WEBHOOK
  on: [failure, queue_empty, quota_high, license_missing, dedupe_relaxed, digest]

variation:
  enabled: true
