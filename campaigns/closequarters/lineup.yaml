#     title: Song Title – Close Quarters      # YouTube only; optional
#     captions:                      # optional per-network versions
#       tiktok: song title by close quarters #newmusic
#     accounts: [nickdotname_tt]     # leave out = everywhere the song goes
#     at: 2026-11-14 18:00           # New York time; leave out = next slot
