<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b14">
<title>Close Quarters · dashboard</title>
<style>
:root{--bg:#0d0b14;--panel:#17141f;--panel2:#1f1b2a;--line:#2b2638;--fg:#f2eff8;--muted:#9a93ab;--dim:#6b6479;
--a:#ffd166;--b:#2ec4b6;--c:#ff6392;--d:#5ac8ff;--ok:#6be38a;--warn:#ffb347;--bad:#ff5c5c;--r:14px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:rgba(13,11,20,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 0}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between}
h1{font-size:17px;margin:0;letter-spacing:.2px}h1 span{color:var(--muted);font-weight:500}
.upd{font-size:12px;color:var(--dim)}
nav{display:flex;gap:4px;margin:10px 0 0}nav button{flex:1;background:none;border:0;color:var(--muted);font:600 14px inherit;padding:10px 4px 12px;border-bottom:2px solid transparent;cursor:pointer}
nav button.on{color:var(--fg);border-color:var(--a)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:99px;padding:6px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
main{padding:12px 14px calc(40px + env(safe-area-inset-bottom));max-width:980px;margin:0 auto}
.day{margin:18px 0 8px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;display:flex;justify-content:space-between}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:8px 0;display:grid;grid-template-columns:64px 1fr;gap:12px}
.thumb{width:64px;height:112px;border-radius:10px;background:var(--panel2);overflow:hidden;position:relative;cursor:pointer;border:0;padding:0}
.thumb video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.thumb:after{content:"▶";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;text-shadow:0 1px 6px #000}
.row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.time{font-weight:700;font-variant-numeric:tabular-nums}
.acc{font-size:13px;color:var(--fg);background:var(--panel2);border-radius:99px;padding:2px 9px 2px 2px;display:inline-flex;align-items:center;gap:6px}
.pfp{width:24px;height:24px;border-radius:50%;object-fit:cover;flex:none;background:var(--line);display:inline-block}
.pfp.big{width:40px;height:40px}.chip .pfp{width:18px;height:18px;margin:-2px 6px -2px -5px;vertical-align:middle}
.ahead{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.thumb .pfp{position:absolute;left:4px;bottom:4px;width:22px;height:22px;border:2px solid var(--panel);z-index:1}
.st{font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;text-transform:uppercase;letter-spacing:.5px}
.st.queued,.st.scheduled,.st.claimed{background:#2a2540;color:var(--d)}.st.published{background:#1d3324;color:var(--ok)}
.st.uploading{background:#173040;color:var(--d);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.st.failed{background:#3d1d24;color:var(--bad)}.st.cancelled{background:#2b2830;color:var(--dim)}.st.late{background:#3a2c14;color:var(--warn)}.st.waiting{background:#2b2830;color:var(--dim)}
.thumb.still{background-size:cover;background-position:center;cursor:default}.thumb.still:after{content:none}
.err{margin-top:4px;color:var(--bad);font-size:12px}.bad{color:var(--bad)}.as{color:var(--dim)}
.note{font-size:12px;color:var(--dim);margin:-2px 0 6px}.more{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
.warnline{margin-top:8px;font-size:12px;font-weight:700;color:var(--warn)}.warnline.bad{color:var(--bad)}
.kpi .d{font-size:12px;font-weight:700;color:var(--ok);margin-left:4px}.kpi .d.neg{color:var(--bad)}.kpi .d.flat{color:var(--dim)}
.song{margin-top:4px;font-weight:600}.what{color:var(--muted);font-size:13px}
.cap{margin-top:6px;color:var(--muted);font-size:13px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cap.open{-webkit-line-clamp:unset}
.nums{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.nums b{color:var(--fg);font-weight:700}.nums .hot b{color:var(--a)}
.tag{font-size:11px;color:var(--a);border:1px solid #4a3f22;border-radius:6px;padding:1px 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.acard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer}
.acard h3{margin:0 0 2px;font-size:15px}.acard .sub{font-size:12px;color:var(--dim)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 8px}.kpi{background:var(--panel2);border-radius:10px;padding:8px}
.kpi b{display:block;font-size:18px;font-variant-numeric:tabular-nums}.kpi span{font-size:11px;color:var(--muted)}
.spark{width:100%;height:40px;display:block}
.next{font-size:13px;color:var(--muted);margin-top:6px}.next b{color:var(--fg)}
.sort{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin:4px 0}
.sort select{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit}
.empty{color:var(--dim);text-align:center;padding:40px 0}
.totals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 14px}
#player{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
#player.on{display:flex}#player video{max-height:88vh;max-width:100%;border-radius:12px}
#player .x{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;font-size:28px;color:#fff;background:none;border:0;cursor:pointer}
@media (min-width:700px){.card{grid-template-columns:80px 1fr}.thumb{width:80px;height:142px}}
</style>
</head>
<body>
<header>
  <div class="top"><h1>Close Quarters <span>· dashboard</span></h1><div class="upd" id="upd">loading…</div></div>
  <nav><button data-tab="next" class="on">Up next</button><button data-tab="posted">Posted</button><button data-tab="accounts">Accounts</button></nav>
  <div class="chips" id="chips"></div>
</header>
<main id="main"><div class="empty">loading…</div></main>
<div id="player"><button class="x" aria-label="close">×</button><video controls playsinline></video></div>
<script>
const $ = s => document.querySelector(s);
const S = {tab: 'next', acc: localStorage.getItem('cq.acc') || 'all', sort: 'newest', data: null, spares: false};
const TZ = 'America/New_York';
const fmt = (d, o) => new Intl.DateTimeFormat('en-US', Object.assign({timeZone: TZ}, o)).format(d);
const dayKey = d => fmt(d, {year: 'numeric', month: '2-digit', day: '2-digit'});
const n = v => v == null ? '–' : v >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : v >= 1e4 ? Math.round(v / 1e3) + 'k' : v >= 1e3 ? (v / 1e3).toFixed(1) + 'k' : String(Math.round(v));
const esc = s => String(s || '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const PF = {};                                   // account -> its profile picture (a data: URL from data.json)
const av = (name, cls) => PF[name] && /^data:image\//.test(PF[name]) ? `<img class="pfp ${cls || ''}" src="${PF[name]}" alt="">` : `<span class="pfp ${cls || ''}"></span>`;
function dayLabel(d) {
  const t = dayKey(new Date()), k = dayKey(d), tm = dayKey(new Date(Date.now() + 864e5)), ys = dayKey(new Date(Date.now() - 864e5));
  return k === t ? 'Today' : k === tm ? 'Tomorrow' : k === ys ? 'Yesterday' : fmt(d, {weekday: 'long', month: 'short', day: 'numeric'});
}
function ago(iso) { const s = (Date.now() - new Date(iso)) / 1e3; return s < 90 ? 'just now' : s < 5400 ? Math.round(s / 60) + ' min ago' : s < 129600 ? Math.round(s / 3600) + ' h ago' : Math.round(s / 86400) + ' d ago'; }
async function load() {
  try {
    const r = await fetch('data.json?t=' + Date.now(), {cache: 'no-store'}); S.data = await r.json();
    S.data.posts.forEach(p => { p.t = new Date(p.posted || p.due || 0); });
    S.data.accounts.forEach(a => { PF[a.name] = a.pfp; });
    $('#upd').textContent = 'updated ' + ago(S.data.generated); chips(); draw();
  } catch (e) { $('#main').innerHTML = '<div class="empty">Could not load the data. Pull to refresh.</div>'; }
}
function chips() {
  const accs = [{name: 'all', handle: 'All accounts'}].concat(S.data.accounts);
  $('#chips').innerHTML = accs.map(a => `<button class="chip ${S.acc === a.name ? 'on' : ''}" data-acc="${a.name}">${a.name === 'all' ? a.handle : av(a.name) + '@' + esc(a.handle)}</button>`).join('');
}
const mine = p => S.acc === 'all' || p.account === S.acc;
// Booked into a slot (the Instagram outbox, or Buffer): these go out at their time.
const BOOKED = ['queued', 'scheduled', 'claimed', 'held', 'publishing'];
const booked = p => BOOKED.includes(p.status);
// 'pending' is a rendered video not booked yet. Its time is only the slot it was made for: if another video took that
// minute it waits for the next free one, so it is listed apart, with no time, and never counts as late.
const spare = p => p.status === 'pending';
const GRACE = 30 * 60e3;        // the publisher runs every 5 minutes and Instagram takes a few more to process a reel
function state(p) {
  if (p.status === 'publishing') return ['uploading', 'posting now'];
  if (booked(p) && p.due) {
    const past = Date.now() - new Date(p.due);
    if (past > GRACE) return ['late', 'overdue'];
    if (past >= 0) return ['uploading', 'posting now'];
    return [p.status, p.via ? 'on buffer' : 'scheduled'];
  }
  if (spare(p)) return ['waiting', 'ready · no slot yet'];
  if (p.status === 'published' && p.via === 'buffer') return ['published', 'sent to buffer'];
  return [p.status, p.status];
}
function numbers(p) {
  const m = p.m || {}; const rate = m.views ? ((m.shares || 0) + (m.saves || 0)) / Math.max(m.reach || m.views, 1) : null;
  if (m.views == null) return `<div class="nums"><span>${p.status === 'failed' ? 'never went out' : Date.now() - p.t < 6 * 36e5 ? 'numbers come in within a few hours' : 'no numbers yet'}</span></div>`;
  return `<div class="nums"><span class="hot"><b>${n(m.views)}</b> views</span>
    ${m.likes != null ? `<span><b>${n(m.likes)}</b> likes</span>` : ''}${m.comments != null ? `<span><b>${n(m.comments)}</b> comments</span>` : ''}
    ${m.shares != null ? `<span><b>${n(m.shares)}</b> sends</span>` : ''}${m.saves != null ? `<span><b>${n(m.saves)}</b> saves</span>` : ''}
    ${m.watch != null ? `<span><b>${m.watch.toFixed(1)}s</b> avg watch</span>` : ''}${rate != null ? `<span><b>${(rate * 100).toFixed(1)}%</b> sent/saved</span>` : ''}
    ${p.mt ? `<span class="as">as of ${ago(p.mt)}</span>` : ''}</div>`;
}
function card(p, showNums, noTime) {
  const [st, label] = state(p);
  const what = [p.what, p.style && p.style !== p.what ? p.style : null].filter(Boolean).join(' · ');
  const thumb = p.video ? `<button class="thumb" data-v="${esc(p.video)}"><video src="${esc(p.video)}#t=1" preload="none" muted playsinline></video>${av(p.account)}</button>`
    : p.image ? `<div class="thumb still" style="background-image:url('${esc(p.image)}')">${av(p.account)}</div>` : `<div class="thumb still">${av(p.account)}</div>`;
  return `<div class="card">${thumb}
    <div>
      <div class="row1">${noTime ? '' : `<span class="time">${fmt(p.t, {hour: 'numeric', minute: '2-digit'})}</span>`}
        <span class="acc">${av(p.account)}@${esc(p.handle)}</span><span class="st ${st}">${esc(label)}</span>
        ${p.trial ? '<span class="tag">trial</span>' : ''}${p.lineup ? '<span class="tag">hand-picked</span>' : ''}</div>
      <div class="song">${esc(p.song || (p.caption || '').split('\n')[0].slice(0, 60))}</div>
      ${what ? `<div class="what">${esc(what)}</div>` : ''}
      ${p.error ? `<div class="err">${esc(p.error)}</div>` : ''}
      <div class="cap">${esc(p.caption)}</div>
      ${showNums ? numbers(p) : ''}
    </div></div>`;
}
function grouped(list, showNums) {
  let out = '', last = '';
  for (const p of list) { const k = dayKey(p.t); if (k !== last) { out += `<div class="day"><span>${dayLabel(p.t)}</span><span>${list.filter(q => dayKey(q.t) === k).length}</span></div>`; last = k; } out += card(p, showNums); }
  return out || '<div class="empty">Nothing here.</div>';
}
function drawNext() {
  const list = S.data.posts.filter(p => mine(p) && booked(p)).sort((a, b) => a.t - b.t);
  const spares = S.data.posts.filter(p => mine(p) && spare(p)).sort((a, b) => a.t - b.t);
  const late = list.filter(p => state(p)[0] === 'late').length;
  let out = `<div class="sort">${list.length} booked · times in New York${late ? ` · <b class="bad">${late} overdue</b>` : ''}</div>` + grouped(list, false);
  if (spares.length) out += `<div class="day"><span>Ready, waiting for a free slot</span><span>${spares.length}</span></div>
    <div class="note">Rendered videos with no slot yet. They are booked as slots free up, so they have no time.</div>
    ${S.spares ? spares.map(p => card(p, false, true)).join('') : `<button class="more" data-more="1">show ${spares.length}</button>`}`;
  return out;
}
function drawPosted() {
  let list = S.data.posts.filter(p => mine(p) && (p.status === 'published' || p.status === 'failed'));
  const key = {views: p => p.m.views || 0, sends: p => p.m.shares || 0, comments: p => p.m.comments || 0, saves: p => p.m.saves || 0, watch: p => p.m.watch || 0};
  if (S.sort === 'newest') list.sort((a, b) => b.t - a.t); else list.sort((a, b) => key[S.sort](b) - key[S.sort](a));
  const wk = list.filter(p => p.status === 'published' && Date.now() - p.t < 7 * 864e5), had = wk.filter(p => p.m.views != null);
  const sum = k => had.length ? n(had.reduce((s, p) => s + (p.m[k] || 0), 0)) : '–';
  const failed = list.filter(p => p.status === 'failed' && Date.now() - p.t < 7 * 864e5).length;
  const head = `<div class="totals"><div class="kpi"><b>${wk.length}</b><span>posts, 7 days</span></div><div class="kpi"><b>${sum('views')}</b><span>views</span></div>
    <div class="kpi"><b>${sum('shares')}</b><span>sends</span></div><div class="kpi"><b>${sum('comments')}</b><span>comments</span></div></div>
    <div class="sort">${had.length < wk.length ? `numbers for ${had.length} of ${wk.length} posts so far · ` : ''}${failed ? `<b class="bad">${failed} failed</b> · ` : ''}Sort <select id="sort">${['newest', 'views', 'sends', 'comments', 'saves', 'watch'].map(k => `<option ${S.sort === k ? 'selected' : ''}>${k}</option>`).join('')}</select></div>`;
  return head + (S.sort === 'newest' ? grouped(list, true) : list.map(p => card(p, true)).join('') || '<div class="empty">Nothing yet.</div>');
}
function spark(vals) {
  const w = 240, h = 40, mx = Math.max(1, ...vals), st = w / Math.max(1, vals.length - 1);
  const pts = vals.map((v, i) => `${(i * st).toFixed(1)},${(h - 3 - (v / mx) * (h - 8)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--a)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
function drawAccounts() {
  const days = [...Array(14)].map((_, i) => dayKey(new Date(Date.now() - (13 - i) * 864e5)));
  return '<div class="grid">' + S.data.accounts.map(a => {
    const ps = S.data.posts.filter(p => p.account === a.name);
    const pub = ps.filter(p => p.status === 'published'), wk = pub.filter(p => Date.now() - p.t < 7 * 864e5), had = wk.filter(p => p.m.views != null);
    const views = had.map(p => p.m.views).sort((x, y) => x - y), med = views.length ? views[Math.floor(views.length / 2)] : null;
    const best = pub.filter(p => p.m.views).sort((x, y) => y.m.views - x.m.views)[0];
    const lined = ps.filter(booked).sort((x, y) => x.t - y.t), nxt = lined[0], ready = ps.filter(spare).length;
    const last = pub.slice().sort((x, y) => y.t - x.t)[0];
    const late = lined.filter(p => state(p)[0] === 'late').length, failed = ps.filter(p => p.status === 'failed' && Date.now() - p.t < 7 * 864e5).length;
    const per = days.map(k => pub.filter(p => dayKey(p.t) === k).reduce((s, p) => s + (p.m.views || 0), 0));
    // Instagram answered no insights for a whole day: every post published in the last 24 h is without numbers, and the
    // oldest went out over 6 h ago, so the 3-hourly metrics run has had its turn. Buffer's accounts are read once a day: left out.
    const day = pub.filter(p => !p.via && Date.now() - p.t < 864e5);
    const denied = day.length && day.some(p => Date.now() - p.t > 6 * 36e5) && !day.some(p => p.m.views != null);
    // followers: today's count and the change since the row 7 days back (or the oldest row the log has within the week)
    const d7 = a.followers_7d, span = a.followers_since ? Math.floor((Date.now() - new Date(a.followers_since + 'T00:00:00Z')) / 864e5) : null;
    const delta = d7 == null ? '' : `<span class="d ${d7 < 0 ? 'neg' : d7 ? '' : 'flat'}">${d7 > 0 ? '+' : ''}${d7}</span>`;
    const fn = v => v == null ? '–' : v < 1e4 ? String(v) : n(v);
    return `<div class="acard" data-acc="${a.name}"><div class="ahead">${av(a.name, 'big')}<div><h3>@${esc(a.handle)}</h3><div class="sub">${lined.length} booked${ready ? ` · ${ready} ready` : ''} · ${pub.length} posted (60 days)${a.link ? ` · bio ${esc(a.link)}` : ''}</div></div></div>
      ${late || failed ? `<div class="warnline">${late ? `${late} overdue` : ''}${late && failed ? ' · ' : ''}${failed ? `${failed} failed this week` : ''}</div>` : ''}
      ${denied ? `<div class="warnline bad">insights denied · no numbers on ${day.length} post${day.length > 1 ? 's' : ''} in 24 h</div>` : ''}
      <div class="kpis"><div class="kpi"><b>${wk.length}</b><span>posts 7d</span></div><div class="kpi"><b>${had.length ? n(had.reduce((s, p) => s + p.m.views, 0)) : '–'}</b><span>views 7d</span></div><div class="kpi"><b>${n(med)}</b><span>median views</span></div></div>
      ${a.followers != null || a.taps7 != null ? `<div class="kpis"><div class="kpi"><b>${fn(a.followers)}${delta}</b><span>followers${span ? ` · ${Math.min(span, 7)}d` : ''}</span></div>
        <div class="kpi"><b>${a.taps7 != null ? a.taps7 : '–'}</b><span>bio taps 7d${a.tap_last ? ` · last ${ago(a.tap_last)}` : a.taps7 != null ? ' · none yet' : ''}</span></div>
        <div class="kpi"><b>${fn(a.media)}</b><span>posts on grid</span></div></div>` : ''}
      ${spark(per)}<div class="next">${nxt ? `next: <b>${dayLabel(nxt.t)} ${fmt(nxt.t, {hour: 'numeric', minute: '2-digit'})}</b> · ${esc(nxt.song || '')}` : 'nothing booked'}</div>
      <div class="next">${last ? `last post: <b>${ago(last.posted || last.due)}</b>` : 'nothing posted yet'}${a.numbers_at ? ` · numbers as of ${ago(a.numbers_at)}` : had.length < wk.length ? ' · numbers not in yet' : ''}</div>
      ${best ? `<div class="next">best: <b>${n(best.m.views)}</b> views · ${esc(best.song || '')}${best.what ? ' · ' + esc(best.what) : ''}</div>` : ''}</div>`;
  }).join('') + '</div>';
}
function draw() {
  if (!S.data) return;
  $('#main').innerHTML = S.tab === 'next' ? drawNext() : S.tab === 'posted' ? drawPosted() : drawAccounts();
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-acc],[data-v],[data-more],.cap,#player .x');
  if (!t) return;
  if (t.dataset.more) { S.spares = true; draw(); return; }
  if (t.dataset.tab) { S.tab = t.dataset.tab; draw(); scrollTo(0, 0); }
  else if (t.dataset.acc) { S.acc = t.dataset.acc; localStorage.setItem('cq.acc', S.acc); if (t.classList.contains('acard')) S.tab = 'posted'; chips(); draw(); scrollTo(0, 0); }
  else if (t.dataset.v) { const v = $('#player video'); v.src = t.dataset.v; $('#player').classList.add('on'); v.play().catch(() => {}); }
  else if (t.classList.contains('cap')) t.classList.toggle('open');
  else { const v = $('#player video'); v.pause(); v.removeAttribute('src'); $('#player').classList.remove('on'); }
});
document.addEventListener('change', e => { if (e.target.id === 'sort') { S.sort = e.target.value; draw(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
setInterval(load, 5 * 60e3); load();
</script>
</body>
